{

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null, engine = null, fill = null;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }
  function pause() { if (ctx && ctx.state === 'running') ctx.suspend(); }

  function env(g, t, a, peak, d) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);

    const o = ctx.createOscillator(), g = ctx.createGain();

function pushOut(p, rad) {

    const arr = treeGrid.get(cellKey(cx + ix, cz + iz));

    for (let i = 0; i < arr.length; i++) {
      const t = arr[i], dx = p.x - t.x, dz = p.z - t.z, m = rad + t.r, d2 = dx * dx + dz * dz;
      if (d2 < m * m) {
        const d = Math.sqrt(d2) || 0.001, k = (m - d) / d;
        p.x += dx * k; p.z += dz * k; hit = true;
      }
    }
  }
  if (pushOutLog(p, rad)) hit = true;
  if (pushOutNpc(p, rad)) hit = true;
  if (pushOutMotel(p, rad)) hit = true;
  if (pushOutRoom(p, rad)) hit = true;
  return hit;
}

function emitSmoke() {
  const p = smoke.find(q => q.life <= 0);
  if (!p) return;
  carGroup.updateMatrixWorld(true);
  _hood.set((Math.random() - 0.5) * 0.7, 1.25, -1.6); carGroup.localToWorld(_hood);
  p.s.position.copy(_hood);
  p.life = 0.001; p.max = 2.2 + Math.random() * 1.2;
  p.vx = (Math.random() - 0.5) * 0.5; p.vz = (Math.random() - 0.5) * 0.5; p.vy = 1.0 + Math.random() * 0.8;

function breakCar() {
  if (car.broken) return;
  car.broken = true; breakT = 0; smokeAcc = 0;
  SFX.breakdown(); SFX.hiss();
}

function updateBreakdown(dt) {

  if (fuelFree && logScene === 'idle' && mode === 'car' && Math.abs(car.speed) > 1) {
    driveTime += dt;
    if (driveTime >= breakAt) spawnLog();
  }
  if (car.broken) {
    breakT += dt;
    if (breakT < 2.5) carParts.headlights.forEach(h => { h.intensity = Math.random() < 0.5 ? 2.4 : 0; });
    else if (headOn) { headOn = false; applyLights(); }
    smokeAcc += dt * 14;
    while (smokeAcc >= 1) { smokeAcc -= 1; emitSmoke(); }
  }
  for (const p of smoke) {
    if (p.life <= 0) continue;
    p.life += dt;
    const t = p.life / p.max;
    if (t >= 1) { p.life = 0; p.s.visible = false; continue; }
    p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
    const sc = 0.7 + t * 2.8; p.s.scale.set(sc, sc, 1);
    p.s.material.opacity = 0.5 * Math.min(1, t * 6) * (1 - t);
  }
}

    carGroup.updateMatrixWorld(true);
    const out = new THREE.Vector3(-2.4, 0, -0.1);
    carGroup.localToWorld(out);
    player.pos.set(out.x, 0, out.z);
    pushOut(player.pos, 0.4);
    player.yaw = car.heading + car.lookYaw;
    player.vel.set(0, 0, 0);
    car.speed = 0; car.steer = 0;
    mode = 'foot';
    applyView();
    return;
  }

  if (canBoard()) { boardNpc(); return; }
  if (motelDoorAction()) return;
  if (logScene === 'blocked' && nearLog()) { startPush(); return; }
  if (stationActive() && nearCounter()) { payAtCounter(); return; }
  if (stationActive() && nearPump() && !eco.filled) {
    if (eco.paid && carAtPump()) { startFilling(); return; }
    if (distToCar() > CONFIG.ENTER_DISTANCE) { say(!eco.paid ? 'Pay for the fuel in the shop first' : 'Move your car closer to the pump'); return; }
  }
  if (distToCar() > CONFIG.ENTER_DISTANCE) return;
  car.lookYaw = clamp(wrapAngle(player.yaw - car.heading), -2.4, 2.4);
  mode = 'car';
  applyView();
  if (logScene === 'cleared') startCrank();
}
function toggleLight() {

  if (mode === 'foot') flashOn = !flashOn; else headOn = !headOn;
  applyLights();
}
function toggleView() {

  thirdPerson = !thirdPerson;
  applyView();
}

const _fwd = { x: 0, z: 0 };
function updateCar(dt) {
  let thr = input.moveY;
  const steerIn = -input.moveX;
  if (sputterT > 0) { sputterT -= dt; thr *= 0.2; }
  if (logScene === 'cranking') thr = 0;
  if (car.fuel <= 0 || car.broken) {
    if (thr > 0 || car.speed < 0.5) thr = 0;
  }
  const handbrake = !!keys.Space || input.brake;
  const onRoad = roadDist2(car.pos.x, car.pos.z) < Math.pow(CONFIG.ROAD_WIDTH / 2 + 0.6, 2);
  let maxF = onRoad ? CONFIG.CAR_MAX_SPEED : CONFIG.CAR_MAX_SPEED_OFFROAD;
  if (phase === 'reserve' && !fuelFree) maxF = Math.min(maxF, CONFIG.RESERVE_MAX);

  if (thr > 0.05) {
    if (car.speed < -0.5) car.speed += 24 * dt;
    else car.speed += thr * 12 * Math.max(0, 1 - Math.max(0, car.speed) / maxF) * dt;
  } else if (thr < -0.05) {
    if (car.speed > 0.5) car.speed -= 26 * (-thr) * dt;
    else car.speed = Math.max(-CONFIG.CAR_REVERSE_SPEED, car.speed + thr * 7 * dt);
  }
  if (car.broken) car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), 3 * dt);

  car.speed -= car.speed * (onRoad ? 0.12 : 0.6) * dt;
  if (Math.abs(thr) < 0.05) car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), 0.8 * dt);
  if (car.speed > maxF) car.speed -= (car.speed - maxF) * 2 * dt;
  if (handbrake) { const d = 30 * dt; car.speed = Math.abs(car.speed) < d ? 0 : car.speed - Math.sign(car.speed) * d; }
  if (Math.abs(car.speed) < 0.12 && Math.abs(thr) < 0.05) car.speed = 0;

  car.steer += (steerIn - car.steer) * Math.min(1, 7 * dt);
  car.steerAngle = car.steer * 0.6 / (1 + Math.abs(car.speed) * 0.07);
  car.heading += car.speed * Math.tan(car.steerAngle) / 3.0 * dt;

  const sh = Math.sin(car.heading), ch = Math.cos(car.heading);
  car.pos.x += -sh * car.speed * dt;
  car.pos.z += -ch * car.speed * dt;

  const sp0 = Math.abs(car.speed);
  let hit = false;
  for (const off of [-1.5, 1.5]) {
    const c = { x: car.pos.x - sh * off, z: car.pos.z - ch * off };
    const ox = c.x, oz = c.z;
    if (pushOut(c, 1.15)) { car.pos.x += c.x - ox; car.pos.z += c.z - oz; hit = true; }
  }
  logHitCool -= dt;
  if (hit && sp0 > 4 && LOG.active && logHitCool <= 0 && distToLog(car.pos.x, car.pos.z) < 3.6) { SFX.thud(); shakeT = 0.4; logHitCool = 1.2; }
  if (hit) car.speed *= 0.6;

  carParts.tail.color.setHex(handbrake || (thr < -0.05 && car.speed > 0.5) ? 0xff2a1a : 0x8a0000);

  carGroup.position.set(car.pos.x, 0, car.pos.z);
  carGroup.rotation.y = car.heading;
  if (!onRoad && Math.abs(car.speed) > 3) carGroup.position.y = Math.sin(performance.now() * 0.03) * 0.012 * Math.abs(car.speed) / 6;
  carParts.wheelsFront.forEach(p => p.rotation.y = car.steerAngle);
  carParts.wheelsAll.forEach(w => w.rotation.x -= car.speed * dt / 0.38);
  carParts.wheel.rotation.z = car.steer * 2.0;
}

function updateFoot(dt) {
  if (eco.filling || pushAnim.active) { player.vel.set(0, 0, 0); return; }
  const mx = input.moveX, my = input.moveY;
  const m = Math.min(1, Math.hypot(mx, my));
  const sp = input.sprint ? CONFIG.RUN_SPEED : CONFIG.WALK_SPEED;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  let tx = 0, tz = 0;
  if (m > 0.01) {
    const fx = -sy, fz = -cy, rx = cy, rz = -sy;
    tx = fx * my + rx * mx; tz = fz * my + rz * mx;
    const l = Math.hypot(tx, tz) || 1;
    tx = tx / l * sp * m; tz = tz / l * sp * m;
  }
  const k = Math.min(1, 10 * dt);
  player.vel.x += (tx - player.vel.x) * k;
  player.vel.z += (tz - player.vel.z) * k;
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  pushOut(player.pos, 0.4);

  const dx = player.pos.x - car.pos.x, dz = player.pos.z - car.pos.z;
  const sh = Math.sin(car.heading), ch = Math.cos(car.heading);
  for (const off of [-1.5, 0, 1.5]) {
    const cx = car.pos.x - sh * off, cz = car.pos.z - ch * off;
    const ddx = player.pos.x - cx, ddz = player.pos.z - cz, d = Math.hypot(ddx, ddz), min = 1.45;
    if (d < min && d > 0.0001) { player.pos.x = cx + ddx / d * min; player.pos.z = cz + ddz / d * min; }
  }
  const spd = Math.hypot(player.vel.x, player.vel.z);
  player.bob += spd * dt * 1.8;
}

const _v = new THREE.Vector3();
function updateCamera(dt) {
  if (ride.active) { rideCamera(dt); return; }
  if (mode === 'foot') {
    const spd = pushAnim.active ? 2.2 : Math.hypot(player.vel.x, player.vel.z);
    camera.position.set(player.pos.x, CONFIG.EYE_HEIGHT + Math.sin(player.bob * 2) * 0.035 * Math.min(1, spd / 3), player.pos.z);
    camera.rotation.set(pitch, player.yaw, 0);
  } else if (!thirdPerson) {
    carGroup.updateMatrixWorld(true);
    _v.copy(SEAT); carGroup.localToWorld(_v);
    camera.position.copy(_v);
    camera.rotation.set(pitch, car.heading + car.lookYaw, 0);
  } else {
    const a = car.heading + car.lookYaw, dist = 8.5;
    const h = clamp(3.2 - pitch * 6, 0.8, 9);
    camera.position.set(car.pos.x + Math.sin(a) * dist, h, car.pos.z + Math.cos(a) * dist);
    camera.lookAt(car.pos.x, 1.2, car.pos.z);
  }
  let sh = 0;
  if (shakeT > 0) { sh = shakeT * 0.1; shakeT -= dt; }
  if (logScene === 'cranking' && (crankT % 1.5) < 1.0 && crankT < 3.7) sh = Math.max(sh, 0.012);
  if (sh > 0) { camera.position.x += (Math.random() - 0.5) * sh; camera.position.y += (Math.random() - 0.5) * sh; }
  sky.position.copy(camera.position);
}

const stationActive = () => ST.placed && !fuelFree;
function inFuelZone() { return ST.placed && Math.hypot(car.pos.x - FUEL_ZONE.x, car.pos.z - FUEL_ZONE.z) < FUEL_ZONE.r; }
function nearPump() { return PUMPS.some(p => Math.hypot(player.pos.x - p.x, player.pos.z - p.z) < 3.0); }
function nearCounter() {

function updateFuelPhase(dt) {

  if (phase === 'drive1') {

const pushAnim = { active: false, t: 0, fx: 0, fz: 0, fyaw: 0, side: 1 };
const smooth = x => x * x * (3 - 2 * x);

function nearLog() { return LOG.active && distToLog(player.pos.x, player.pos.z) < 2.8; }

function contactPose(theta, side) {
  const d = logPose(theta);
  const cx = LOG.pvx + d.dx * CONFIG.LOG_LENGTH * 0.62, cz = LOG.pvz + d.dz * CONFIG.LOG_LENGTH * 0.62;
  const nx = -d.dz * side, nz = d.dx * side, off = LOG.r + 0.4 + 0.3;
  return { x: cx + nx * off, z: cz + nz * off, yaw: Math.atan2(nx, nz) };
}
function startPush() {
  const d = logPose(LOG.theta), cx = (LOG.ax + LOG.bx) / 2, cz = (LOG.az + LOG.bz) / 2;
  pushAnim.side = ((car.pos.x - cx) * -d.dz + (car.pos.z - cz) * d.dx) >= 0 ? 1 : -1;
  pushAnim.active = true; pushAnim.t = 0;
  pushAnim.fx = player.pos.x; pushAnim.fz = player.pos.z; pushAnim.fyaw = player.yaw;
  player.vel.set(0, 0, 0);
  logScene = 'pushing';
  SFX.scrapeStart();
}
function updatePush(dt) {
  if (!pushAnim.active) return;
  pushAnim.t += dt; player.bob += dt * 4.2;
  const A = 0.9, T = CONFIG.PUSH_TIME;
  let pose, s = 0;
  if (pushAnim.t < A) {
    const e = smooth(pushAnim.t / A), c = contactPose(LOG_THETA0, pushAnim.side);
    pose = { x: pushAnim.fx + (c.x - pushAnim.fx) * e, z: pushAnim.fz + (c.z - pushAnim.fz) * e,
             yaw: pushAnim.fyaw + wrapAngle(c.yaw - pushAnim.fyaw) * e };
  } else {
    s = clamp((pushAnim.t - A) / T, 0, 1);
    setLogTheta(LOG_THETA0 + (LOG_THETA1 - LOG_THETA0) * smooth(s));
    pose = contactPose(LOG.theta, pushAnim.side);
    SFX.scrapeSet(0.04 + 0.1 * 6 * s * (1 - s));
  }
  player.pos.set(pose.x, 0, pose.z); player.yaw = pose.yaw;
  pitch += (-0.3 - pitch) * Math.min(1, 4 * dt);
  if (s >= 1) {
    pushAnim.active = false; logScene = 'cleared'; pitch = -0.04;
    SFX.scrapeStop(); SFX.thud();
  }
}

function startCrank() { logScene = 'cranking'; crankT = 0; SFX.crank(); }
function updateCrank(dt) {
  crankCool -= dt;
  if (logScene === 'broken' && mode === 'car' && input.moveY > 0.5 && crankCool <= 0) { SFX.crank(true); crankCool = 2.4; }
  if (logScene !== 'cranking') return;
  crankT += dt;
  const turning = (crankT % 1.5) < 1.0 && crankT < 3.7;
  const pulse = turning ? 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(crankT * 55)) : 1;
  if (headOn) carParts.headlights.forEach(h => { h.intensity = 2.4 * pulse; });
  speedEl.style.opacity = fuelEl.style.opacity = turning ? (0.55 + 0.45 * Math.random()) : 1;
  if (crankT >= CONFIG.CRANK_TIME) {
    speedEl.style.opacity = fuelEl.style.opacity = '';
    logScene = 'broken'; breakCar();
    evt.state = 'BROKEN'; evt.t = 0;
  }
}

const fadeEl = $('fade'), clockEl = $('clock');
const evt = { state: 'NONE', t: 0 };
const FADE_OUT = 1.8, CLOCK_HOLD = 2.5, FADE_IN = 1.8;
const HELP_TRAVEL = 20.1;
const NPC = { active: false, solid: false, mode: '', x: 0, z: 0, h: 0, v: 0, tz: 0, stopZ: 0, passed: false };

(function buildNpcCar() {

const npcFocus = () => (mode === 'car' ? car.pos : player.pos);

function pickLaneX(defaultX) {
  let best = defaultX, bs = -1e9;
  for (const x of [-3.0, -2.4, -1.6, 0, 1.6, 2.4, 3.0]) {
    let s = Math.abs(x - car.pos.x) - 2.4 - 1.0;
    if (mode === 'foot') s = Math.min(s, Math.abs(x - player.pos.x) - 0.5 - 1.0);
    if (LOG.active) for (let i = 0; i <= 8; i++) s = Math.min(s, Math.abs(x - (LOG.ax + (LOG.bx - LOG.ax) * i / 8)) - LOG.r - 1.0);
    if (x === defaultX) s += 0.4;
    if (s > bs) { bs = s; best = x; }
  }
  return best;
}

function hideNpc() {
  NPC.active = false; NPC.solid = false;
  npcGroup.position.set(0, -1000, 0);
}

function startCarPass() {
  const uz = roadDirZ();
  NPC.mode = 'pass'; NPC.passed = false; NPC.solid = false;
  NPC.x = pickLaneX(2.4 * uz);
  NPC.z = npcFocus().z + uz * 72;
  NPC.tz = -uz;
  NPC.h = Math.atan2(0, uz);
  NPC.v = 24;
  npcParts.paint.color.set(0x1d3a5c);

}

function startHelp() {
  const f = npcFocus(), uz = roadDirZ();
  NPC.mode = 'help'; NPC.passed = false; NPC.solid = false;
  NPC.x = pickLaneX(-2.4 * uz);
  let sz = f.z + uz * 6;
  for (const dz of [0, 6, -6, 12, -12, 20, -20]) {
    const z = f.z + uz * dz;
    const dc = Math.hypot(NPC.x - car.pos.x, z - car.pos.z), dp = Math.hypot(NPC.x - f.x, z - f.z);
    const dl = LOG.active ? distToLog(NPC.x, z) : 99;
    if (dc >= 5.5 && dp >= 3.0 && dl >= 2.8) { sz = z; break; }
  }
  NPC.stopZ = sz;
  NPC.z = sz - uz * 300;
  NPC.tz = uz;
  NPC.h = Math.atan2(0, -uz);
  NPC.v = 16;
  npcParts.paint.color.set(0xcfd2d8);

}

function updateNpc(dt) {
  if (!NPC.active) return;
  if (NPC.mode === 'pass') {
    NPC.z += NPC.tz * NPC.v * dt;
    const f = npcFocus(), ahead = (f.z - NPC.z) * NPC.tz;
    if (!NPC.passed && ahead <= 0) { NPC.passed = true; evt.state = 'WAIT_60_2'; evt.t = 0; }
    if (NPC.passed && -ahead > 380) { hideNpc(); return; }
  } else if (NPC.mode === 'help') {
    const d = (NPC.stopZ - NPC.z) * NPC.tz;
    if (d <= 0.05) { NPC.z = NPC.stopZ; NPC.v = 0; NPC.solid = true; }
    else {
      NPC.v = Math.min(16, Math.max(0.35, Math.sqrt(2 * 6 * d)));
      NPC.z += NPC.tz * NPC.v * dt;
      if ((NPC.stopZ - NPC.z) * NPC.tz < 0) NPC.z = NPC.stopZ;
    }
  }
  if (NPC.mode === 'carry' || NPC.mode === 'leave') {
    NPC.v = Math.min(18, NPC.v + 4 * dt); NPC.z += NPC.tz * NPC.v * dt;
    if (NPC.mode === 'leave' && Math.abs(NPC.z - NPC.z0) > 450) { hideNpc(); return; }
  }
  npcGroup.position.set(NPC.x, 0, NPC.z);
  npcGroup.rotation.y = NPC.h;
  npcParts.wheels.forEach(w => { w.rotation.x -= NPC.v * dt / 0.38; });
  if (npcParts.driverPerson) npcParts.driverPerson.update(dt, Dialog.active && NPC.mode === 'carry', 0);
}

function pushOutNpc(p, rad) {
  if (!NPC.solid) return false;
  let hit = false;
  const sh = Math.sin(NPC.h), ch = Math.cos(NPC.h);
  for (const off of [-1.5, 0, 1.5]) {
    const cx = NPC.x - sh * off, cz = NPC.z - ch * off, dx = p.x - cx, dz = p.z - cz, m = rad + 1.1, d2 = dx * dx + dz * dz;
    if (d2 < m * m) { const d = Math.sqrt(d2) || 0.001, k = (m - d) / d; p.x += dx * k; p.z += dz * k; hit = true; }
  }
  return hit;
}

function updateEvents(dt) {
  switch (evt.state) {
    case 'BROKEN':
      startCarPass(); evt.state = 'CAR_PASS'; evt.t = 0; evt.spawned = false; break;
    case 'CAR_PASS':

    case 'WAIT_60_2':
      evt.t += dt;
      if (!evt.spawned && evt.t >= 60 - HELP_TRAVEL) { evt.spawned = true; startHelp(); }
      if (evt.spawned && NPC.solid) { evt.state = 'HELP_WAIT'; evt.t = 0; }
      break;
    case 'HELP_WAIT':

      break;

const Radio = (() => {
  const FILES = ['car_radio1.mp3', 'car_radio2.mp3', 'car_radio3.mp3'];
  const btn = $('radio');
  const unit = () => carParts.radio && carParts.radio.display.material.color;
  let on = false, idx = 0, el = null, fails = 0, want = false;

  function render() { const uc = unit(); if (uc) uc.setHex(on ? 0x39ff7a : 0x0a1a10); btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function kill() {
    if (!el) return;
    const a = el; el = null; want = false;
    a.onended = a.onerror = null;
    try { a.pause(); a.removeAttribute('src'); a.load(); } catch (e) {}
  }
  function failed() {
    if (!on) return;
    kill(); fails++;
    if (fails >= FILES.length) return;
    idx = (idx + 1) % FILES.length; start();
  }
  function start() {
    kill();
    if (!on) return;
    let a;
    try { a = new Audio(); } catch (e) { return; }
    el = a; a.preload = 'auto'; a.volume = 0.85;
    a.onended = () => { if (el !== a) return; kill(); idx = (idx + 1) % FILES.length; start(); };
    a.onerror = () => { if (el === a) failed(); };
