<script>
// If something breaks (old browser, no WebGL, three.js failed to load) the reason stays on screen (tap/click the red box to hide it).
(function () {
  var seen = {}, order = [], timer = 0;
  function render() {
    timer = 0;
    var e = document.getElementById('errfull'); if (!e) return;
    e.style.display = 'block';
    e.textContent = 'ERROR - take a photo / screenshot and send it\n\n' + order.map(function (k) { return '[' + seen[k] + 'x] ' + k; }).join('\n\n');
  }
  window.reportErr = function (m) {
    var k = String(m).slice(0, 600);
    if (!(k in seen)) { seen[k] = 0; order.push(k); if (order.length > 8) { delete seen[order.shift()]; } }
    seen[k]++;
    if (!timer) timer = setTimeout(render, 300);          // at most once per 0.3 s: the text does not flicker even if the error repeats every frame
  };
  window.onerror = function (m, src, l, c, err) {
    window.reportErr(m + ' (line ' + l + ':' + c + ')' + (err && err.stack ? '\n' + String(err.stack).split('\n').slice(0, 4).join('\n') : ''));
  };
  window.addEventListener('unhandledrejection', function (ev) { window.reportErr('Promise: ' + (ev.reason && (ev.reason.stack || ev.reason.message) || ev.reason)); });
})();

function logPose(theta) {
  const sx = -Math.sin(theta), sz = Math.cos(theta);
  return { dx: LOG.rx * sx + LOG.ux * sz, dz: LOG.rz * sx + LOG.uz * sz };
}
function setLogTheta(theta) {
  LOG.theta = theta;
  const d = logPose(theta);
  LOG.ax = LOG.pvx; LOG.az = LOG.pvz;
  LOG.bx = LOG.ax + d.dx * CONFIG.LOG_LENGTH; LOG.bz = LOG.az + d.dz * CONFIG.LOG_LENGTH;
  logGroup.position.set((LOG.ax + LOG.bx) / 2, 0.5, (LOG.az + LOG.bz) / 2);
  logGroup.rotation.y = Math.atan2(-d.dz, d.dx);
}
function distToLog(x, z) {
  const abx = LOG.bx - LOG.ax, abz = LOG.bz - LOG.az, l2 = abx * abx + abz * abz;
  const t = clamp(((x - LOG.ax) * abx + (z - LOG.az) * abz) / l2, 0, 1);
  return Math.hypot(x - (LOG.ax + abx * t), z - (LOG.az + abz * t));
}

function pushOutLog(p, rad) {
  if (!LOG.active) return false;
  const abx = LOG.bx - LOG.ax, abz = LOG.bz - LOG.az, l2 = abx * abx + abz * abz;
  const t = clamp(((p.x - LOG.ax) * abx + (p.z - LOG.az) * abz) / l2, 0, 1);
  const cx = LOG.ax + abx * t, cz = LOG.az + abz * t;
  const dx = p.x - cx, dz = p.z - cz, m = rad + LOG.r, d2 = dx * dx + dz * dz;
  if (d2 >= m * m) return false;
  const d = Math.sqrt(d2) || 0.001, k = (m - d) / d;
  p.x += dx * k; p.z += dz * k;
  return true;
}

  LOG.ux = 0; LOG.uz = uz; LOG.rx = -uz; LOG.rz = 0;
  LOG.pvx = LOG.rx * 4.6; LOG.pvz = pz;

function pushOut(p, rad) {
  let hit = false;
  const cx = Math.floor(p.x / CELL), cz = Math.floor(p.z / CELL);
  for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
    const arr = treeGrid.get(cellKey(cx + ix, cz + iz));
    if (!arr) continue;
    for (let i = 0; i < arr.length; i++) {
      const t = arr[i], dx = p.x - t.x, dz = p.z - t.z, m = rad + t.r, d2 = dx * dx + dz * dz;
      if (d2 < m * m) {
        const d = Math.sqrt(d2) || 0.001, k = (m - d) / d;
        p.x += dx * k; p.z += dz * k; hit = true;
      }
    }
  }
  if (pushOutLog(p, rad)) hit = true;
  if (pushOutNpc(p, rad)) hit = true;
  if (pushOutMotel(p, rad)) hit = true;
  if (pushOutRoom(p, rad)) hit = true;
  return hit;
}

  if (handbrake) { const d = 30 * dt; car.speed = Math.abs(car.speed) < d ? 0 : car.speed - Math.sign(car.speed) * d; }
  if (Math.abs(car.speed) < 0.12 && Math.abs(thr) < 0.05) car.speed = 0;

  car.steer += (steerIn - car.steer) * Math.min(1, 7 * dt);
  car.steerAngle = car.steer * 0.6 / (1 + Math.abs(car.speed) * 0.07);
  car.heading += car.speed * Math.tan(car.steerAngle) / 3.0 * dt;

  const sh = Math.sin(car.heading), ch = Math.cos(car.heading);
  car.pos.x += -sh * car.speed * dt;
  car.pos.z += -ch * car.speed * dt;

  const sp0 = Math.abs(car.speed);
  let hit = false;
  for (const off of [-1.5, 1.5]) {
    const c = { x: car.pos.x - sh * off, z: car.pos.z - ch * off };
    const ox = c.x, oz = c.z;
    if (pushOut(c, 1.15)) { car.pos.x += c.x - ox; car.pos.z += c.z - oz; hit = true; }
  }
  logHitCool -= dt;
  if (hit && sp0 > 4 && LOG.active && logHitCool <= 0 && distToLog(car.pos.x, car.pos.z) < 3.6) { SFX.thud(); shakeT = 0.4; logHitCool = 1.2; }
  if (hit) car.speed *= 0.6;

  carParts.tail.color.setHex(handbrake || (thr < -0.05 && car.speed > 0.5) ? 0xff2a1a : 0x8a0000);

  carGroup.position.set(car.pos.x, 0, car.pos.z);
  carGroup.rotation.y = car.heading;
  if (!onRoad && Math.abs(car.speed) > 3) carGroup.position.y = Math.sin(performance.now() * 0.03) * 0.012 * Math.abs(car.speed) / 6;
  carParts.wheelsFront.forEach(p => p.rotation.y = car.steerAngle);
  carParts.wheelsAll.forEach(w => w.rotation.x -= car.speed * dt / 0.38);
  carParts.wheel.rotation.z = car.steer * 2.0;
}

function updateFoot(dt) {
  if (eco.filling || pushAnim.active) { player.vel.set(0, 0, 0); return; }
  const mx = input.moveX, my = input.moveY;
  const m = Math.min(1, Math.hypot(mx, my));
  const sp = input.sprint ? CONFIG.RUN_SPEED : CONFIG.WALK_SPEED;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  let tx = 0, tz = 0;
  if (m > 0.01) {
    const fx = -sy, fz = -cy, rx = cy, rz = -sy;
    tx = fx * my + rx * mx; tz = fz * my + rz * mx;
    const l = Math.hypot(tx, tz) || 1;
    tx = tx / l * sp * m; tz = tz / l * sp * m;
  }
  const k = Math.min(1, 10 * dt);
  player.vel.x += (tx - player.vel.x) * k;
  player.vel.z += (tz - player.vel.z) * k;
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  pushOut(player.pos, 0.4);

  const dx = player.pos.x - car.pos.x, dz = player.pos.z - car.pos.z;
  const sh = Math.sin(car.heading), ch = Math.cos(car.heading);
  for (const off of [-1.5, 0, 1.5]) {
    const cx = car.pos.x - sh * off, cz = car.pos.z - ch * off;
    const ddx = player.pos.x - cx, ddz = player.pos.z - cz, d = Math.hypot(ddx, ddz), min = 1.45;
    if (d < min && d > 0.0001) { player.pos.x = cx + ddx / d * min; player.pos.z = cz + ddz / d * min; }
  }
  const spd = Math.hypot(player.vel.x, player.vel.z);
  player.bob += spd * dt * 1.8;
}

const _v = new THREE.Vector3();
function updateCamera(dt) {

}

const pushAnim = { active: false, t: 0, fx: 0, fz: 0, fyaw: 0, side: 1 };
const smooth = x => x * x * (3 - 2 * x);

function nearLog() { return LOG.active && distToLog(player.pos.x, player.pos.z) < 2.8; }

function contactPose(theta, side) {
  const d = logPose(theta);
  const cx = LOG.pvx + d.dx * CONFIG.LOG_LENGTH * 0.62, cz = LOG.pvz + d.dz * CONFIG.LOG_LENGTH * 0.62;
  const nx = -d.dz * side, nz = d.dx * side, off = LOG.r + 0.4 + 0.3;

}
function startPush() {
  const d = logPose(LOG.theta), cx = (LOG.ax + LOG.bx) / 2, cz = (LOG.az + LOG.bz) / 2;
  pushAnim.side = ((car.pos.x - cx) * -d.dz + (car.pos.z - cz) * d.dx) >= 0 ? 1 : -1;
  pushAnim.active = true; pushAnim.t = 0;
  pushAnim.fx = player.pos.x; pushAnim.fz = player.pos.z; pushAnim.fyaw = player.yaw;
  player.vel.set(0, 0, 0);

  SFX.scrapeStart();
}
function updatePush(dt) {
  if (!pushAnim.active) return;
  pushAnim.t += dt; player.bob += dt * 4.2;
  const A = 0.9, T = CONFIG.PUSH_TIME;
  let pose, s = 0;
  if (pushAnim.t < A) {
    const e = smooth(pushAnim.t / A), c = contactPose(LOG_THETA0, pushAnim.side);
    pose = { x: pushAnim.fx + (c.x - pushAnim.fx) * e, z: pushAnim.fz + (c.z - pushAnim.fz) * e,

  } else {
    s = clamp((pushAnim.t - A) / T, 0, 1);
    setLogTheta(LOG_THETA0 + (LOG_THETA1 - LOG_THETA0) * smooth(s));
    pose = contactPose(LOG.theta, pushAnim.side);

  }
  player.pos.set(pose.x, 0, pose.z); player.yaw = pose.yaw;
  pitch += (-0.3 - pitch) * Math.min(1, 4 * dt);

function pickLaneX(defaultX) {
  let best = defaultX, bs = -1e9;
  for (const x of [-3.0, -2.4, -1.6, 0, 1.6, 2.4, 3.0]) {
    let s = Math.abs(x - car.pos.x) - 2.4 - 1.0;
    if (mode === 'foot') s = Math.min(s, Math.abs(x - player.pos.x) - 0.5 - 1.0);
    if (LOG.active) for (let i = 0; i <= 8; i++) s = Math.min(s, Math.abs(x - (LOG.ax + (LOG.bx - LOG.ax) * i / 8)) - LOG.r - 1.0);
    if (x === defaultX) s += 0.4;
    if (s > bs) { bs = s; best = x; }
  }
  return best;
}

function pushOutNpc(p, rad) {
  if (!NPC.solid) return false;
  let hit = false;
  const sh = Math.sin(NPC.h), ch = Math.cos(NPC.h);
  for (const off of [-1.5, 0, 1.5]) {
    const cx = NPC.x - sh * off, cz = NPC.z - ch * off, dx = p.x - cx, dz = p.z - cz, m = rad + 1.1, d2 = dx * dx + dz * dz;
    if (d2 < m * m) { const d = Math.sqrt(d2) || 0.001, k = (m - d) / d; p.x += dx * k; p.z += dz * k; hit = true; }
  }

}

function updateEvents(dt) {

const Radio = (() => {
  const FILES = ['car_radio1.mp3', 'car_radio2.mp3', 'car_radio3.mp3'];
  const btn = $('radio');
  const unit = () => carParts.radio && carParts.radio.display.material.color;
  let on = false, idx = 0, el = null, fails = 0, want = false;

  function render() { const uc = unit(); if (uc) uc.setHex(on ? 0x39ff7a : 0x0a1a10); btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function kill() {
    if (!el) return;
    const a = el; el = null; want = false;
    a.onended = a.onerror = null;
    try { a.pause(); a.removeAttribute('src'); a.load(); } catch (e) {}
  }
  function failed() {
    if (!on) return;
    kill(); fails++;
    if (fails >= FILES.length) return;
    idx = (idx + 1) % FILES.length; start();
  }
  function start() {
    kill();
    if (!on) return;
    let a;
    try { a = new Audio(); } catch (e) { return; }
    el = a; a.preload = 'auto'; a.volume = 0.85;
    a.onended = () => { if (el !== a) return; kill(); idx = (idx + 1) % FILES.length; start(); };
    a.onerror = () => { if (el === a) failed(); };
    a.addEventListener('playing', () => { if (el === a) fails = 0; });
    try { a.src = FILES[idx]; } catch (e) { failed(); return; }
    want = false;
    sync();
  }

  function sync() {
    if (!el) return;
    const should = on && mode === 'car' && running;
    if (should && !want) {
      want = true; const a = el;
      try { const p = a.play(); if (p && p.catch) p.catch(() => { if (el === a) { want = false; if (!a.error) return; failed(); } }); } catch (e) { failed(); }
    } else if (!should && want) { want = false; try { el.pause(); } catch (e) {} }
  }
  function toggle() {
    on = !on; fails = 0;
    if (on) { idx = 0; start(); } else kill();
    render();
  }
  render();
  return { toggle, update: sync, get on() { return on; }, get index() { return idx; }, get element() { return el; } };
})();

const Dialog = (() => {
  const box = $('dialog'), nameEl = $('dlgName'), textEl = $('dlgText');
  let q = [], i = 0, t = 0, dur = 3, done = null, active = false;
  function show() {
    const l = q[i];
    nameEl.textContent = l.who; nameEl.className = l.me ? 'me' : '';
    textEl.textContent = l.text; box.style.display = 'block';
    t = 0; dur = 1.7 + l.text.length * 0.05;
  }
  function finish() {
    active = false; box.style.display = 'none'; inputEnabled = true;
    const cb = done; done = null; if (cb) cb();
  }
  function next() { if (!active) return; i++; if (i >= q.length) finish(); else show(); }
  return {
    play(lines, cb) { if (active || !lines.length) return false; q = lines; i = 0; done = cb || null; active = true; inputEnabled = false; show(); return true; },
