<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NIGHT TO NEVER — The Road</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
// Errors go to the browser console only; the menu shows a short note if WebGL is missing.
window.reportErr = function (m) { try { console.error(m); var e = document.getElementById('err'); if (e && /WebGL/.test(String(m))) e.textContent = 'WebGL is not available in this browser.'; } catch (x) {} };
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="crosshair"></div>
<div id="speed">0<small>km/h</small></div>
<div id="fuel"><div>FUEL <span id="fuelTxt">0</span> L</div><div class="fbar"><div id="fuelBar"></div></div></div>
<div id="radio" title="" role="button" aria-label="radio"><svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 L24 4"/><rect x="3" y="11" width="26" height="16" rx="3"/><circle cx="11" cy="19" r="4.2"/><path d="M19 16h6M19 20h6M19 24h3"/></svg></div>
<div id="money">$200</div>
<div id="paid"></div>
<div id="msg"></div>
<div id="dialog"><div id="dlgName"></div><div id="dlgText"></div></div>
<div id="fade"><div id="clock">00:00</div></div>

<div id="touchui">
  <div id="joyBase"></div><div id="joyKnob"></div>
  <div class="tbtn" id="bAct">Action</div>
  <div class="tbtn" id="bLight">Light</div>
  <div class="tbtn" id="bCam">View</div>
  <div class="tbtn" id="bBrake">Handbrake</div>
</div>

<div id="menu">
  <div id="mleft">
    <h1>NIGHT TO NEVER</h1>
    <h2>The Road</h2>
    <button id="play">Play</button>
  </div>
  <div id="eps">
    <div class="eh">Episodes</div>
    <button id="epHome">Staying Home</button>
    <button id="epRoad">The Road</button>
  </div>
  <div class="mail">Support Email:<br>nighttonever@gmail.com</div>
  <div id="err"></div>
  <div class="ver">v0.13.0 — detailed models</div>
</div>
<div id="vhs"><canvas id="vnoise"></canvas><div class="scan"></div><div class="bar"></div><div class="bar2"></div><div class="vig"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>window.THREE || document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>
<script src="game.js"></script>
<script>if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
