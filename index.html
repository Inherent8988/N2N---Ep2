<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8e8ec; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }

  /* ---------- HUD ---------- */
  #hint { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; font-size: 12px;
    color: rgba(255,255,255,.55); text-shadow: 0 1px 3px #000; pointer-events: none; line-height: 1.5; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
    background: rgba(255,255,255,.55); pointer-events: none; }
  .touch #crosshair { display: none; }
  #prompt { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); padding: 8px 16px; border-radius: 8px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2); font-size: 15px; display: none; pointer-events: none; white-space: nowrap; }
  #speed { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 28px; font-weight: 700;

  #speed small { font-size: 12px; font-weight: 400; opacity: .7; margin-left: 4px; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 8px 16px; border-radius: 8px;
    background: rgba(120,10,10,.75); font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }

  /* ---------- MENU ---------- */
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,14,24,.88), rgba(0,0,0,.97)); text-align: center; padding: 20px; }
  #menu .tag { font-size: 12px; letter-spacing: 6px; color: #8a8f9c; margin-bottom: 10px; }

  /* ---------- TOUCH UI ---------- */
  #touchui { display: none; }

    line-height: 1.15; z-index: 5; }
  .tbtn:active, .tbtn.on { background: rgba(179,32,32,.55); }
  .tbtn.dim { opacity: .45; }
  #bAct   { width: 78px; height: 78px; right: calc(20px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); font-size: 13px; }
  #bLight { width: 54px; height: 54px; right: calc(110px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); }

/* ---------- ТОПЛИВО / ЗАПРАВКА ---------- */
#fuel { position: fixed; right: 18px; bottom: calc(60px + env(safe-area-inset-bottom)); width: 150px; display: none; pointer-events: none;
  font-size: 11px; letter-spacing: 1px; text-align: right; text-shadow: 0 1px 3px #000; }
#fuel .fbar { margin: 4px 0 0 auto; height: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(0,0,0,.45); border-radius: 2px; overflow: hidden; }
#fuelBar { height: 100%; width: 100%; background: #3ecf6a; transition: width .2s, background .3s; }
#fuel.low { color: #ff8a8a; animation: fuelblink 1s steps(2, start) infinite; }
#fuel.low #fuelBar { background: #d83030; }
@keyframes fuelblink { 50% { opacity: .45; } }
#station { position: fixed; left: 12px; top: calc(44px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 8px; border-radius: 6px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2);
  font-size: 13px; pointer-events: none; }
#stArrow { display: inline-block; width: 22px; text-align: center; font-size: 20px; line-height: 1; color: #ffd24a; }
#station.urgent { border-color: #d83030; }
#station.urgent #stArrow { color: #ff5a5a; }
#money { position: fixed; left: 12px; top: calc(84px + env(safe-area-inset-top)); display: none; padding: 3px 10px; border-radius: 6px;
  background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); font-size: 12px; pointer-events: none; }

/* ---------- СОБЫТИЕ (крупная надпись) ---------- */
#event { position: fixed; left: 50%; top: 28%; transform: translateX(-50%); width: 92%; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 1s; z-index: 6; }
#event .t { font-size: clamp(22px, 5vw, 44px); letter-spacing: 8px; font-weight: 800; color: #d32020; text-shadow: 0 0 18px rgba(200,20,20,.7); }
#event .s { margin-top: 10px; font-size: clamp(13px, 2.4vw, 18px); letter-spacing: 2px; color: #cfd2d8; text-shadow: 0 1px 4px #000; }

/* ---------- ЦЕЛЬ ---------- */
#goal { position: fixed; left: 50%; bottom: calc(8px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 90%;
  padding: 4px 14px; border-radius: 6px; background: rgba(0,0,0,.4); font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,.75); pointer-events: none; text-align: center; }

/* ---------- ЗАТЕМНЕНИЕ И ВРЕМЯ (сцена после поломки) ---------- */
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 8;
  display: flex; align-items: center; justify-content: center; }
#clock { color: #fff; opacity: 0; font-size: clamp(48px, 12vw, 120px); font-weight: 300; letter-spacing: 6px;
  font-variant-numeric: tabular-nums; }

/* ---------- РАДИО: справа внизу рядом со спидометром; выключено — тусклая иконка, включено — светится ---------- */
#radio { position: fixed; right: 138px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 46px; height: 40px; z-index: 5;
  display: none; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; user-select: none;
  color: rgba(255,255,255,.55); background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.18); opacity: .5;
  transition: color .2s, opacity .2s, box-shadow .2s, background .2s; -webkit-tap-highlight-color: transparent; }
#radio.on { color: #ffd24a; opacity: 1; background: rgba(60,40,0,.45); border-color: rgba(255,210,74,.7);
  box-shadow: 0 0 14px rgba(255,200,60,.65), inset 0 0 8px rgba(255,200,60,.3); }
#radio.on svg { filter: drop-shadow(0 0 5px rgba(255,210,74,.9)); }
.touch #speed { bottom: calc(186px + env(safe-area-inset-bottom)); }
.touch #fuel { bottom: calc(228px + env(safe-area-inset-bottom)); }
.touch #radio { right: 138px; bottom: calc(182px + env(safe-area-inset-bottom)); }

/* ---------- ДИАЛОГИ ---------- */
#dialog { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(720px, 92vw);
  padding: 12px 18px; border-radius: 10px; background: rgba(6,8,14,.82); border: 1px solid rgba(255,255,255,.18); z-index: 7;
  display: none; pointer-events: none; text-shadow: 0 1px 2px #000; }
#dlgName { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #c9b27a; margin-bottom: 4px; }
#dlgName.me { color: #8fc4ff; }
#dlgText { font-size: clamp(15px, 2.4vw, 19px); line-height: 1.4; }

#err { display: none; max-width: min(560px, 90vw); margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: rgba(120,20,20,.35);
  border: 1px solid rgba(255,120,120,.5); color: #ffb4b4; font: 12px/1.4 monospace; white-space: pre-wrap; text-align: left; }
</style>

<script>
(() => {
'use strict';

if (typeof THREE === 'undefined') {
  document.getElementById('menu').innerHTML =
    '<h1 style="font-size:28px">Не загрузился three.js</h1><p style="max-width:420px;color:#9aa0ad">Нужен интернет. Для APK скачай three.min.js, положи рядом с этим файлом и поменяй путь в теге &lt;script src&gt;.</p>';
  return;
}

/* =====================================================================
   НАСТРОЙКИ  (удобно менять в одном месте)
   ===================================================================== */
const CONFIG = {
  ROAD_WIDTH: 8,
  ROAD_SHOULDER: 1.6,
  CAR_MAX_SPEED: 30,       // м/с (~108 км/ч)
  CAR_MAX_SPEED_OFFROAD: 12,
  CAR_REVERSE_SPEED: 8,
  WALK_SPEED: 2.8,
  RIDE_TIME: 60,          // поездка с водителем, с
  CAR_DIALOG: true,       // короткий диалог при посадке (false — сразу едем)
  RUN_SPEED: 6.2,
  EYE_HEIGHT: 1.7,
  ENTER_DISTANCE: 4.2,
  MOUSE_SENS: 0.0022,
  TOUCH_LOOK_SENS: 0.0045,
  FOG_DENSITY: 0.012,
  // --- топливо и маршрут ---
  FUEL_TANK: 40,            // л, объём бака
  FUEL_START: 28,           // л на старте
  FUEL_RESERVE: 2.5,        // л: к моменту «кашля» стрелка падает до этого значения
  FUEL_LOW: 0.2,            // доля бака, ниже которой горит предупреждение
  RUNOUT_AFTER: 210,        // с езды до момента «бензин кончился» (3 мин 30 с; было 6 минут)
  RESERVE_BURN: 0.0025,     // л/м в режиме «на парах»
  RESERVE_MAX: 16,          // м/с, потолок скорости «на парах»
  STATION_AHEAD: 450,       // м вперёд по дороге, где появится заправка
  FUEL_COST: 7,             // $ за полный бак (цена заправки)
  MONEY_START: 200,          // $ у игрока на старте
  REFUEL_RATE: 4,           // л/с у колонки
  // --- поломка ---
  // --- сцена с бревном и поломкой ---
  BREAKDOWN_AFTER: 360,     // с езды после заправки до появления бревна (6 минут)
  BREAKDOWN_JITTER: 20,     // ± случайный разброс, с
  LOG_AHEAD: 130,           // м впереди машины, где ложится бревно
  LOG_LENGTH: 9.2,          // м, длина бревна
  PUSH_TIME: 4.2,           // с, длительность отталкивания бревна
  CRANK_TIME: 4.3,          // с попыток завести мотор до «смерти» двигателя
};

// Для теста: ?runout=15&station=120&breakdown=20 — бензин кончается через 15 с езды, заправка в 120 м, поломка через 20 с после заправки
{
  const qs = new URLSearchParams(location.search);
  const b = parseFloat(qs.get('breakdown')), st = parseFloat(qs.get('station'));
  if (b > 0) { CONFIG.BREAKDOWN_AFTER = b; CONFIG.BREAKDOWN_JITTER = 0; }
  if (st > 0) CONFIG.STATION_AHEAD = st;
  const ro = parseFloat(qs.get('runout')); if (ro > 0) CONFIG.RUNOUT_AFTER = ro;
}
const TOUCH_UI = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
if (TOUCH_UI) document.body.classList.add('touch');

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapAngle = a => ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261111);

/* =====================================================================
   ЗВУК (WebAudio, без внешних файлов)
   ===================================================================== */
const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null, engine = null, fill = null;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }
  function pause() { if (ctx && ctx.state === 'running') ctx.suspend(); }

  function env(g, t, a, peak, d) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, t, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, 0.01, vol, dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol, freq, q) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = ctx.createGain(); env(g, t, 0.005, vol, dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  // один «чих» мотора, которому не хватает топлива
  function chug(t, v) { tone('sawtooth', 95, 42, t, 0.14, 0.32 * v); noise(t, 0.1, 0.22 * v, 220, 0.9); }

  // длинный: мотор захлёбывается, паузы всё длиннее, потом глохнет и снова «схватывает»
  function sputter() {
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.05;
    [0, 0.22, 0.5, 0.85, 1.3, 1.85, 2.5, 3.0].forEach((d, i) => chug(t0 + d, 0.95 - i * 0.07));
    tone('sawtooth', 120, 35, t0 + 3.2, 0.5, 0.18);
    noise(t0 + 3.1, 0.25, 0.25, 700, 0.8);
  }
  // короткий кашель на ходу
  function cough() {
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.02;
    [0, 0.16, 0.38, 0.7].forEach((d, i) => chug(t0 + d, 0.8 - i * 0.15));
  }
  function breakdown() {
    if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    noise(t, 0.5, 0.5, 300, 0.5);
    tone('square', 200, 40, t, 0.35, 0.3);
    tone('sawtooth', 160, 25, t + 0.1, 1.3, 0.25);
    noise(t + 0.7, 0.3, 0.25, 1800, 2);
  }
  function clunk() { if (!ctx) return; const t = ctx.currentTime; tone('square', 220, 70, t, 0.12, 0.25); noise(t, 0.08, 0.2, 1500, 2); }
  function ding() { if (!ctx) return; const t = ctx.currentTime; tone('sine', 988, 988, t, 0.5, 0.16); tone('sine', 740, 740, t + 0.18, 0.7, 0.16); }
  function cash() {
    if (!ctx) return; const t = ctx.currentTime;
    noise(t, 0.05, 0.2, 4000, 3);
    tone('sine', 1568, 1568, t + 0.06, 0.5, 0.14);
    tone('sine', 2093, 2093, t + 0.12, 0.7, 0.12);
  }
  function fillStart() {
    if (!ctx) return; fillStop();
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0.1;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    fill = { s };
  }
  function fillStop() { if (fill) { try { fill.s.stop(); } catch (e) {} fill = null; } }

  // непрерывный гул двигателя; вызывается каждый кадр
  function engineSet(on, speed, stutter) {
    if (!ctx) return;
    if (!engine) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 260; g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(); o2.start();
      engine = { o, o2, f, g };
    }
    const t = ctx.currentTime, f0 = 32 + speed * 2.6;
    engine.o.frequency.setTargetAtTime(f0, t, 0.08);
    engine.o2.frequency.setTargetAtTime(f0 * 0.5, t, 0.08);
    engine.f.frequency.setTargetAtTime(180 + speed * 14, t, 0.1);
    const vol = !on ? 0 : (stutter ? 0.02 + Math.random() * 0.05 : 0.09 + Math.min(0.06, speed * 0.003));
    engine.g.gain.setTargetAtTime(vol, t, 0.05);
  }

  function thud() { if (!ctx) return; const t = ctx.currentTime; tone('sine', 110, 38, t, 0.35, 0.55); noise(t, 0.18, 0.4, 160, 0.8); }
  function hiss() { if (!ctx) return; noise(ctx.currentTime, 1.2, 0.18, 5500, 0.6); }
  // стартёр крутит, но мотор не схватывает; short — одна короткая попытка
  function crank(short) {
    if (!ctx) return; const t0 = ctx.currentTime + 0.05;
    const groups = short ? [[0, 6, 0.22]] : [[0, 8, 0.30], [1.5, 7, 0.24], [3.0, 5, 0.16]];
    groups.forEach(g => {

const _wrap = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

  if (NPC.active && NPC.v > 1.5) watch.push(NPC);
  const k = Math.min(1, 2.2 * dt);
  for (const f of figures) {

    for (const w of watch) {

// Кусок генерируется детерминированно: один и тот же индекс — всегда одни и те же деревья и люди
function genChunk(ci) {

  const near = TOUCH_UI ? 100 : 150, total = near + (TOUCH_UI ? 30 : 50);
  const minRoad = CONFIG.ROAD_WIDTH / 2 + CONFIG.ROAD_SHOULDER + 1.4, z0 = ci * CL, recs = [], keys = new Set();
  const addRec = rec => {
    recs.push(rec);

    if (!treeGrid.has(k)) treeGrid.set(k, []);

      if (inClearing(x, z)) continue;

    const hue = 0.28 + rnd() * 0.1, sat = rnd(), lum = rnd();
    if (Math.abs(x) < minRoad || inClearing(x, z)) continue;
    if (spots.some(p => (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z) < 2.0 * 2.0)) continue;
    const sp = pickSpecies(sr);
    if (sp < 0) break;
    const i = takeSlot(sp);
    _dummy.position.set(x, 0, z); _dummy.rotation.set((rnd() - 0.5) * 0.06, rot, (rnd() - 0.5) * 0.06); _dummy.scale.set(w, s, w); _dummy.updateMatrix();
    SPECIES[sp].mesh.setMatrixAt(i, _dummy.matrix);
    const v = 0.55 + lum * 0.75;                                                // оттенок поверх цветов вершин: деревья не одинаковые
    _col.setRGB(v * (0.9 + sat * 0.2), v * (0.95 + (hue - 0.28) * 2), v * (0.9 + sat * 0.1));
    SPECIES[sp].mesh.setColorAt(i, _col);
    addRec({ x, z, r: (sp === 1 ? 0.4 : sp === 2 ? 0.35 : 0.45) * s, sp, i, dead: false });
    n++;
  }
  treeChunks.set(ci, { recs, keys });
  treeDirty = true;
}

function unloadChunk(ci) {
  const c = treeChunks.get(ci);
  if (!c) return;
  for (const rec of c.recs) if (!rec.dead) hideRec(rec);
  c.keys.forEach(k => {
    const arr = treeGrid.get(k);
    if (!arr) return;
    const rest = arr.filter(q => !q.dead);
    if (rest.length) treeGrid.set(k, rest); else treeGrid.delete(k);
  });
  treeChunks.delete(ci);
  treeDirty = true;
}

// Вырубка поляны (заправка): уже растущие деревья убираем, будущие куски здесь деревьев не получат
function removeTreesNear(x, z, r) {
  CLEARINGS.push({ x, z, r });
  const r2 = r * r;
  treeChunks.forEach(c => c.recs.forEach(t => {
    if (t.dead) return;
    const dx = t.x - x, dz = t.z - z;
    if (dx * dx + dz * dz < r2) { hideRec(t); t.x = t.z = 1e9; treeDirty = true; }
  }));
}

// Каждый кадр: земля и асфальт едут за камерой, лес подгружается впереди и выгружается позади
function updateWorld(cx, cz, all) {
  const gx = Math.round(cx / TILE) * TILE, gz = Math.round(cz / TILE) * TILE;
  ground.position.set(gx, 0, gz);
  roadMesh.position.set(0, 0.05, Math.round(cz / ROAD_TILE) * ROAD_TILE);
  const c0 = Math.floor(cz / CL);
  Array.from(treeChunks.keys()).forEach(ci => { if (Math.abs(ci - c0) > TREE_RANGE + 1) unloadChunk(ci); });
  let budget = all ? 1e9 : 1;                                  // не больше одного куска за кадр (без пиков нагрузки)
  for (let d = 0; d <= TREE_RANGE && budget > 0; d++) {
    for (const ci of (d ? [c0 - d, c0 + d] : [c0])) {
      if (!treeChunks.has(ci) && budget > 0) { genChunk(ci); budget--; }
    }
  }
  if (treeDirty) {
    fitCounts();
    SPECIES.forEach(sp => { sp.mesh.instanceMatrix.needsUpdate = true; if (sp.mesh.instanceColor) sp.mesh.instanceColor.needsUpdate = true; });
    treeDirty = false;
  }
}

   Локальные координаты: x — вправо от дороги по ходу движения, z — назад вдоль дороги.
   ===================================================================== */

function stationToWorld(lat, along) {
  return { x: ST.x + ST.nx * lat + ST.tx * along, z: ST.z + ST.nz * lat + ST.tz * along };
}
function worldToStation(x, z) {
  const dx = x - ST.x, dz = z - ST.z;
  return { lat: dx * ST.nx + dz * ST.nz, along: dx * ST.tx + dz * ST.tz };
}

// Ставит заправку справа от дороги на `ahead` метров впереди машины (по ходу её движения)
function placeStation(ahead) {
  if (ST.placed) return;
  const uz = roadDirZ();
  ST.x = 0; ST.z = car.pos.z + uz * ahead;
  ST.tx = 0; ST.tz = -uz;                            // локальная ось z — назад
  ST.nx = -uz; ST.nz = 0;                            // локальная ось x — вправо по ходу
  ST.rotY = Math.atan2(ST.tx, ST.tz);
  ST.placed = true;
  stationGroup.position.set(ST.x, 0, ST.z);
  stationGroup.rotation.y = ST.rotY;

  const c = stationToWorld(16, 0);
  removeTreesNear(c.x, c.z, 30);                     // вырубаем поляну
  stationSolids.forEach(s => { const w = stationToWorld(s[0], s[1]); addObstacle(w.x, w.z, s[2]); });
  PUMPS.length = 0;
  PUMP_LOCAL.forEach(s => PUMPS.push(stationToWorld(s[0], s[1])));
  const z = stationToWorld(10.2, 0); FUEL_ZONE.x = z.x; FUEL_ZONE.z = z.z;
}

// направление бревна от шарнира в координатах (вправо, вперёд) -> мир
function logPose(theta) {
  const sx = -Math.sin(theta), sz = Math.cos(theta);
  return { dx: LOG.rx * sx + LOG.ux * sz, dz: LOG.rz * sx + LOG.uz * sz };
}
function setLogTheta(theta) {
  LOG.theta = theta;
  const d = logPose(theta);
  LOG.ax = LOG.pvx; LOG.az = LOG.pvz;
  LOG.bx = LOG.ax + d.dx * CONFIG.LOG_LENGTH; LOG.bz = LOG.az + d.dz * CONFIG.LOG_LENGTH;
  logGroup.position.set((LOG.ax + LOG.bx) / 2, 0.5, (LOG.az + LOG.bz) / 2);
  logGroup.rotation.y = Math.atan2(-d.dz, d.dx);
}
function distToLog(x, z) {
  const abx = LOG.bx - LOG.ax, abz = LOG.bz - LOG.az, l2 = abx * abx + abz * abz;
  const t = clamp(((x - LOG.ax) * abx + (z - LOG.az) * abz) / l2, 0, 1);
  return Math.hypot(x - (LOG.ax + abx * t), z - (LOG.az + abz * t));
}
// бревно — капсула: выталкиваем из неё круг (машину или игрока)
function pushOutLog(p, rad) {
  if (!LOG.active) return false;
  const abx = LOG.bx - LOG.ax, abz = LOG.bz - LOG.az, l2 = abx * abx + abz * abz;
  const t = clamp(((p.x - LOG.ax) * abx + (p.z - LOG.az) * abz) / l2, 0, 1);
  const cx = LOG.ax + abx * t, cz = LOG.az + abz * t;
  const dx = p.x - cx, dz = p.z - cz, m = rad + LOG.r, d2 = dx * dx + dz * dz;
  if (d2 >= m * m) return false;
  const d = Math.sqrt(d2) || 0.001, k = (m - d) / d;
  p.x += dx * k; p.z += dz * k;
  return true;
}

// кладём бревно поперёк дороги на LOG_AHEAD м впереди машины (по ходу её движения)
function spawnLog() {
  if (LOG.active) return;
  const uz = roadDirZ();
  let ahead = CONFIG.LOG_AHEAD, pz = car.pos.z + uz * ahead;
  for (let k = 0; k < 3 && ST.placed; k++) {                      // не кладём прямо на площадку АЗС
    const sc = stationToWorld(16, 0);
    if (Math.abs(pz - sc.z) > 60) break;
    ahead += 90; pz = car.pos.z + uz * ahead;
  }
  LOG.ux = 0; LOG.uz = uz; LOG.rx = -uz; LOG.rz = 0;
  LOG.pvx = LOG.rx * 4.6; LOG.pvz = pz;
  LOG.active = true;
  setLogTheta(LOG_THETA0);
  logScene = 'blocked';
}

// Выталкивание круга из деревьев. Возвращает true при столкновении.
function pushOut(p, rad) {
  let hit = false;
  const cx = Math.floor(p.x / CELL), cz = Math.floor(p.z / CELL);
  for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
    const arr = treeGrid.get(cellKey(cx + ix, cz + iz));
    if (!arr) continue;
    for (let i = 0; i < arr.length; i++) {
      const t = arr[i], dx = p.x - t.x, dz = p.z - t.z, m = rad + t.r, d2 = dx * dx + dz * dz;
      if (d2 < m * m) {
        const d = Math.sqrt(d2) || 0.001, k = (m - d) / d;
        p.x += dx * k; p.z += dz * k; hit = true;
      }
    }
  }
  if (pushOutLog(p, rad)) hit = true;
  if (pushOutNpc(p, rad)) hit = true;
  if (pushOutMotel(p, rad)) hit = true;
  return hit;
}

function emitSmoke() {
  const p = smoke.find(q => q.life <= 0);
  if (!p) return;
  carGroup.updateMatrixWorld(true);
  _hood.set((Math.random() - 0.5) * 0.7, 1.25, -1.6); carGroup.localToWorld(_hood);
  p.s.position.copy(_hood);
  p.life = 0.001; p.max = 2.2 + Math.random() * 1.2;
  p.vx = (Math.random() - 0.5) * 0.5; p.vz = (Math.random() - 0.5) * 0.5; p.vy = 1.0 + Math.random() * 0.8;
  p.s.visible = true;
}

function breakCar() {
  if (car.broken) return;
  car.broken = true; breakT = 0; smokeAcc = 0;
  SFX.breakdown(); SFX.hiss();
}

function updateBreakdown(dt) {
  // после заправки считаем время езды; когда оно выйдет — на дороге впереди ложится бревно
  if (fuelFree && logScene === 'idle' && mode === 'car' && Math.abs(car.speed) > 1) {
    driveTime += dt;
    if (driveTime >= breakAt) spawnLog();
  }
  if (car.broken) {
    breakT += dt;
    if (breakT < 2.5) carParts.headlights.forEach(h => { h.intensity = Math.random() < 0.5 ? 2.4 : 0; });   // фары мигают
    else if (headOn) { headOn = false; applyLights(); }                                                       // и гаснут
    smokeAcc += dt * 14;
    while (smokeAcc >= 1) { smokeAcc -= 1; emitSmoke(); }
  }
  for (const p of smoke) {
    if (p.life <= 0) continue;
    p.life += dt;
    const t = p.life / p.max;
    if (t >= 1) { p.life = 0; p.s.visible = false; continue; }
    p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
    const sc = 0.7 + t * 2.8; p.s.scale.set(sc, sc, 1);
    p.s.material.opacity = 0.5 * Math.min(1, t * 6) * (1 - t);
  }
}

// Поворот копится из событий мыши/тача и применяется ОДИН раз за кадр (в начале кадра, до движения и камеры):
// так вид и направление ходьбы всегда согласованы, а лишние события между кадрами не дают рывков.
let lookAccX = 0, lookAccY = 0;
function addLook(dx, dy, sens) {
  if (!isFinite(dx) || !isFinite(dy)) return;
  lookAccX += dx * sens; lookAccY += dy * sens;
}
function flushLook() {
  if (!inputEnabled) { lookAccX = lookAccY = 0; return; }
  if (lookAccX === 0 && lookAccY === 0) return;
  if (mode === 'foot') player.yaw -= lookAccX;
  else car.lookYaw = clamp(car.lookYaw - lookAccX, -2.4, 2.4);
  pitch = clamp(pitch - lookAccY, -1.35, 1.35);
  lookAccX = lookAccY = 0;
  lastLookTime = performance.now();
}

function isButton(t) { return t.target && t.target.closest && t.target.closest('.tbtn, #radio'); }
document.addEventListener('touchstart', e => {
  if (!running) return;
  if (Dialog.active) { Dialog.skip(); e.preventDefault(); return; }
  for (const t of e.changedTouches) {
    if (isButton(t)) continue;
    if (t.clientX < window.innerWidth * 0.5 && joy.id === null) {
      joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY; joy.x = joy.y = 0;
      const b = $('joyBase'), k = $('joyKnob');
      b.style.display = k.style.display = 'block';
      b.style.left = k.style.left = joy.ox + 'px'; b.style.top = k.style.top = joy.oy + 'px';
    } else if (t.clientX >= window.innerWidth * 0.5 && lookTouch.id === null) {
      lookTouch.id = t.identifier; lookTouch.x = t.clientX; lookTouch.y = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (!running) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
      const len = Math.hypot(dx, dy);
      if (len > JOY_R) { dx *= JOY_R / len; dy *= JOY_R / len; }
      $('joyKnob').style.left = (joy.ox + dx) + 'px'; $('joyKnob').style.top = (joy.oy + dy) + 'px';
      let nx = dx / JOY_R, ny = -dy / JOY_R;
      const m = Math.hypot(nx, ny);
      if (m < 0.12) { nx = ny = 0; }
      joy.x = nx; joy.y = ny;
    } else if (t.identifier === lookTouch.id) {
      addLook(t.clientX - lookTouch.x, t.clientY - lookTouch.y, CONFIG.TOUCH_LOOK_SENS);
      lookTouch.x = t.clientX; lookTouch.y = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      joy.id = null; joy.x = joy.y = 0;
      $('joyBase').style.display = $('joyKnob').style.display = 'none';
    }
    if (t.identifier === lookTouch.id) lookTouch.id = null;
  }
}
document.addEventListener('touchend', endTouch);
document.addEventListener('touchcancel', endTouch);

function bindButton(id, down, up) {

  el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); if (running && inputEnabled && !Dialog.active) down(); }, { passive: false });
  const end = e => { e.preventDefault(); if (up) up(); };
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
}

function distToCar() { return Math.hypot(player.pos.x - car.pos.x, player.pos.z - car.pos.z); }

function toggleCar() {
  if (eco.filling || pushAnim.active || logScene === 'cranking') return;
  if (mode === 'car') {
    if (Math.abs(car.speed) > 4) return;
    carGroup.updateMatrixWorld(true);
    const out = new THREE.Vector3(-2.4, 0, -0.1);
    carGroup.localToWorld(out);
    player.pos.set(out.x, 0, out.z);
    pushOut(player.pos, 0.4);
    player.yaw = car.heading + car.lookYaw;
    player.vel.set(0, 0, 0);
    car.speed = 0; car.steer = 0;
    mode = 'foot';
    applyView();
    return;
  }
  // пешком: посадка к водителю / двери мотеля / бревно -> касса -> колонка -> посадка в свою машину
  if (canBoard()) { boardNpc(); return; }
  if (motelDoorAction()) return;
  if (logScene === 'blocked' && nearLog()) { startPush(); return; }
  if (stationActive() && nearCounter()) { payAtCounter(); return; }
  if (stationActive() && eco.paid && nearPump() && inFuelZone()) { startFilling(); return; }
  if (distToCar() > CONFIG.ENTER_DISTANCE) return;
  car.lookYaw = clamp(wrapAngle(player.yaw - car.heading), -2.4, 2.4);
  mode = 'car';
  applyView();
  if (logScene === 'cleared') startCrank();                      // сели — мотор не заводится
}
function toggleLight() {
  if (car.broken && mode === 'car') return;
  if (mode === 'foot') flashOn = !flashOn; else headOn = !headOn;
  applyLights();
}
function toggleView() {
  if (mode !== 'car') return;
  thirdPerson = !thirdPerson;
  applyView();
}

/* =====================================================================
   ОБНОВЛЕНИЕ: машина
   ===================================================================== */
const _fwd = { x: 0, z: 0 };
function updateCar(dt) {
  let thr = input.moveY;
  const steerIn = -input.moveX;       // руль: влево = +
  if (sputterT > 0) { sputterT -= dt; thr *= 0.2; }      // мотор захлёбывается
  if (logScene === 'cranking') thr = 0;
  if (car.fuel <= 0 || car.broken) {   // заглох: ни газа, ни заднего хода; тормозить можно
    if (thr > 0 || car.speed < 0.5) thr = 0;
  }
  const handbrake = !!keys.Space || input.brake;
  const onRoad = roadDist2(car.pos.x, car.pos.z) < Math.pow(CONFIG.ROAD_WIDTH / 2 + 0.6, 2);
  let maxF = onRoad ? CONFIG.CAR_MAX_SPEED : CONFIG.CAR_MAX_SPEED_OFFROAD;
  if (phase === 'reserve' && !fuelFree) maxF = Math.min(maxF, CONFIG.RESERVE_MAX);   // «на парах»

  if (thr > 0.05) {
    if (car.speed < -0.5) car.speed += 24 * dt;                         // тормозим задний ход
    else car.speed += thr * 12 * Math.max(0, 1 - Math.max(0, car.speed) / maxF) * dt;
  } else if (thr < -0.05) {
    if (car.speed > 0.5) car.speed -= 26 * (-thr) * dt;                 // тормоз
    else car.speed = Math.max(-CONFIG.CAR_REVERSE_SPEED, car.speed + thr * 7 * dt);
  }
  if (car.broken) car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), 3 * dt);   // сломанная машина быстро катится до остановки
  // сопротивление
  car.speed -= car.speed * (onRoad ? 0.12 : 0.6) * dt;
  if (Math.abs(thr) < 0.05) car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), 0.8 * dt);
  if (car.speed > maxF) car.speed -= (car.speed - maxF) * 2 * dt;
  if (handbrake) { const d = 30 * dt; car.speed = Math.abs(car.speed) < d ? 0 : car.speed - Math.sign(car.speed) * d; }
  if (Math.abs(car.speed) < 0.12 && Math.abs(thr) < 0.05) car.speed = 0;

  // руль
  car.steer += (steerIn - car.steer) * Math.min(1, 7 * dt);
  car.steerAngle = car.steer * 0.6 / (1 + Math.abs(car.speed) * 0.07);
  car.heading += car.speed * Math.tan(car.steerAngle) / 3.0 * dt;

  // движение
  const sh = Math.sin(car.heading), ch = Math.cos(car.heading);
  car.pos.x += -sh * car.speed * dt;
  car.pos.z += -ch * car.speed * dt;

  // столкновения: две окружности (нос и корма)
  const sp0 = Math.abs(car.speed);
  let hit = false;
  for (const off of [-1.5, 1.5]) {
    const c = { x: car.pos.x - sh * off, z: car.pos.z - ch * off };
    const ox = c.x, oz = c.z;
    if (pushOut(c, 1.15)) { car.pos.x += c.x - ox; car.pos.z += c.z - oz; hit = true; }
  }
  logHitCool -= dt;
  if (hit && sp0 > 4 && LOG.active && logHitCool <= 0 && distToLog(car.pos.x, car.pos.z) < 3.6) { SFX.thud(); shakeT = 0.4; logHitCool = 1.2; }   // врезались в бревно
  if (hit) car.speed *= 0.6;

  carParts.tail.color.setHex(handbrake || (thr < -0.05 && car.speed > 0.5) ? 0xff2a1a : 0x8a0000);   // стоп-сигналы
  // визуал
  carGroup.position.set(car.pos.x, 0, car.pos.z);
  carGroup.rotation.y = car.heading;
  if (!onRoad && Math.abs(car.speed) > 3) carGroup.position.y = Math.sin(performance.now() * 0.03) * 0.012 * Math.abs(car.speed) / 6;
  carParts.wheelsFront.forEach(p => p.rotation.y = car.steerAngle);
  carParts.wheelsAll.forEach(w => w.rotation.x -= car.speed * dt / 0.38);
  carParts.wheel.rotation.z = car.steer * 2.0;
}

/* =====================================================================
   ОБНОВЛЕНИЕ: пешком
   ===================================================================== */
function updateFoot(dt) {
  if (eco.filling || pushAnim.active) { player.vel.set(0, 0, 0); return; }
  const mx = input.moveX, my = input.moveY;
  const m = Math.min(1, Math.hypot(mx, my));
  const sp = input.sprint ? CONFIG.RUN_SPEED : CONFIG.WALK_SPEED;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  let tx = 0, tz = 0;
  if (m > 0.01) {
    const fx = -sy, fz = -cy, rx = cy, rz = -sy;
    tx = fx * my + rx * mx; tz = fz * my + rz * mx;
    const l = Math.hypot(tx, tz) || 1;
    tx = tx / l * sp * m; tz = tz / l * sp * m;
  }
  const k = Math.min(1, 10 * dt);
  player.vel.x += (tx - player.vel.x) * k;
  player.vel.z += (tz - player.vel.z) * k;
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  pushOut(player.pos, 0.4);
  // не проходим сквозь машину
  const dx = player.pos.x - car.pos.x, dz = player.pos.z - car.pos.z;
  const sh = Math.sin(car.heading), ch = Math.cos(car.heading);
  for (const off of [-1.5, 0, 1.5]) {
    const cx = car.pos.x - sh * off, cz = car.pos.z - ch * off;
    const ddx = player.pos.x - cx, ddz = player.pos.z - cz, d = Math.hypot(ddx, ddz), min = 1.45;
    if (d < min && d > 0.0001) { player.pos.x = cx + ddx / d * min; player.pos.z = cz + ddz / d * min; }
  }
  const spd = Math.hypot(player.vel.x, player.vel.z);
  player.bob += spd * dt * 1.8;
}

const _v = new THREE.Vector3();
function updateCamera(dt) {
  if (ride.active) { rideCamera(dt); return; }
  if (mode === 'foot') {
    const spd = pushAnim.active ? 2.2 : Math.hypot(player.vel.x, player.vel.z);
    camera.position.set(player.pos.x, CONFIG.EYE_HEIGHT + Math.sin(player.bob * 2) * 0.035 * Math.min(1, spd / 3), player.pos.z);
    camera.rotation.set(pitch, player.yaw, 0);
  } else if (!thirdPerson) {
    carGroup.updateMatrixWorld(true);
    _v.copy(SEAT); carGroup.localToWorld(_v);
    camera.position.copy(_v);
    camera.rotation.set(pitch, car.heading + car.lookYaw, 0);
  } else {
    const a = car.heading + car.lookYaw, dist = 8.5;
    const h = clamp(3.2 - pitch * 6, 0.8, 9);
    camera.position.set(car.pos.x + Math.sin(a) * dist, h, car.pos.z + Math.cos(a) * dist);
    camera.lookAt(car.pos.x, 1.2, car.pos.z);
  }
  let sh = 0;                                                    // тряска: удар о бревно, стартёр
  if (shakeT > 0) { sh = shakeT * 0.1; shakeT -= dt; }
  if (logScene === 'cranking' && (crankT % 1.5) < 1.0 && crankT < 3.7) sh = Math.max(sh, 0.012);
  if (sh > 0) { camera.position.x += (Math.random() - 0.5) * sh; camera.position.y += (Math.random() - 0.5) * sh; }
  sky.position.copy(camera.position);
}

const stationActive = () => ST.placed && !fuelFree;
function inFuelZone() { return ST.placed && Math.hypot(car.pos.x - FUEL_ZONE.x, car.pos.z - FUEL_ZONE.z) < FUEL_ZONE.r; }
function nearPump() { return PUMPS.some(p => Math.hypot(player.pos.x - p.x, player.pos.z - p.z) < 3.0); }

/* ---------- топливо ---------- */
// 1) drive1: стрелка бензина плавно падает, пока игрок едет (RUNOUT_AFTER секунд)
// 2) reserve: мотор кашляет, скорость ограничена, впереди появляется заправка
// 3) заправка: оплатить в магазине -> заправить у колонки -> fuelFree (бензин больше не тратится)
function startRunout() {
  phase = 'reserve';
  car.fuel = CONFIG.FUEL_RESERVE;
  sputterT = 3.4; coughTimer = 7;
  SFX.sputter();
  placeStation(CONFIG.STATION_AHEAD);
}
function cough() {
  sputterT = 0.9 + Math.random() * 0.6;
  coughTimer = 5 + Math.random() * 6;
  SFX.cough();
}
function updateFuelPhase(dt) {
  if (mode !== 'car' || fuelFree || car.broken) return;
  const moving = Math.abs(car.speed) > 1;
  if (phase === 'drive1') {
    if (moving) driveTime += dt;
    const k = Math.min(1, driveTime / CONFIG.RUNOUT_AFTER);
    car.fuel = CONFIG.FUEL_START + (CONFIG.FUEL_RESERVE - CONFIG.FUEL_START) * k;
    if (driveTime >= CONFIG.RUNOUT_AFTER) startRunout();
  } else if (phase === 'reserve') {
    if (moving) car.fuel = Math.max(0.5, car.fuel - Math.abs(car.speed) * dt * CONFIG.RESERVE_BURN);
    coughTimer -= dt;
    if (coughTimer <= 0) cough();
  }
}

function payAtCounter() {
  if (eco.paid || !inFuelZone() || eco.money < CONFIG.FUEL_COST) return;
  eco.money -= CONFIG.FUEL_COST; eco.paid = true;
  SFX.cash();
}
function startFilling() {
  eco.filling = true; player.vel.set(0, 0, 0);
  SFX.clunk(); SFX.fillStart();
}
function updateFilling(dt) {
  if (!eco.filling) return;
  car.fuel = Math.min(CONFIG.FUEL_TANK, car.fuel + CONFIG.REFUEL_RATE * dt);
  if (car.fuel >= CONFIG.FUEL_TANK - 1e-3) {
    eco.filling = false; eco.filled = true;
    SFX.fillStop(); SFX.clunk();
    fuelFree = true; phase = 'fueled'; sputterT = 0; driveTime = 0;      // дальше бензин не тратится
    breakAt = CONFIG.BREAKDOWN_AFTER + (Math.random() * 2 - 1) * CONFIG.BREAKDOWN_JITTER;
  }
}

// звонок над дверью при входе/выходе
function updateShopBell() {
  if (!ST.placed) return;
  const q = worldToStation(player.pos.x, player.pos.z);
  const inside = mode === 'foot' && q.lat > SHOP.x0 + 0.3 && q.lat < SHOP.x1 && q.along > SHOP.z0 && q.along < SHOP.z1;
  if (inside !== wasInShop) { wasInShop = inside; SFX.ding(); }
}

/* ---------- сцена поломки: бревно на дороге ----------
   logScene: idle -> blocked -> pushing -> cleared -> cranking -> broken
   idle     — едем; после заправки идёт отсчёт езды (BREAKDOWN_AFTER), потом бревно ложится на дорогу
   blocked  — бревно перегородило дорогу, машина упирается и встаёт
   pushing  — игрок отталкивает бревно (анимация: подход, упор, бревно отъезжает к обочине)
   cleared  — дорога свободна, ждём, пока игрок сядет в машину
   cranking — стартёр крутит, мотор не схватывает (мигают фары и приборы)
   broken   — двигатель мёртв, из-под капота дым; игрок застрял (машину сама не чиним) */
const pushAnim = { active: false, t: 0, fx: 0, fz: 0, fyaw: 0, side: 1 };
const smooth = x => x * x * (3 - 2 * x);

function nearLog() { return LOG.active && distToLog(player.pos.x, player.pos.z) < 2.8; }

// где стоит игрок, пока толкает: на стороне машины, на 62% длины бревна от шарнира
function contactPose(theta, side) {
  const d = logPose(theta);
  const cx = LOG.pvx + d.dx * CONFIG.LOG_LENGTH * 0.62, cz = LOG.pvz + d.dz * CONFIG.LOG_LENGTH * 0.62;
  const nx = -d.dz * side, nz = d.dx * side, off = LOG.r + 0.4 + 0.3;
  return { x: cx + nx * off, z: cz + nz * off, yaw: Math.atan2(nx, nz) };
}
function startPush() {
  const d = logPose(LOG.theta), cx = (LOG.ax + LOG.bx) / 2, cz = (LOG.az + LOG.bz) / 2;
  pushAnim.side = ((car.pos.x - cx) * -d.dz + (car.pos.z - cz) * d.dx) >= 0 ? 1 : -1;   // со стороны машины
  pushAnim.active = true; pushAnim.t = 0;
  pushAnim.fx = player.pos.x; pushAnim.fz = player.pos.z; pushAnim.fyaw = player.yaw;
  player.vel.set(0, 0, 0);
  logScene = 'pushing';
  SFX.scrapeStart();
}
function updatePush(dt) {
  if (!pushAnim.active) return;
  pushAnim.t += dt; player.bob += dt * 4.2;
  const A = 0.9, T = CONFIG.PUSH_TIME;
  let pose, s = 0;
  if (pushAnim.t < A) {                                           // подходим к бревну
    const e = smooth(pushAnim.t / A), c = contactPose(LOG_THETA0, pushAnim.side);
    pose = { x: pushAnim.fx + (c.x - pushAnim.fx) * e, z: pushAnim.fz + (c.z - pushAnim.fz) * e,
             yaw: pushAnim.fyaw + wrapAngle(c.yaw - pushAnim.fyaw) * e };
  } else {                                                        // упираемся и толкаем
    s = clamp((pushAnim.t - A) / T, 0, 1);
    setLogTheta(LOG_THETA0 + (LOG_THETA1 - LOG_THETA0) * smooth(s));
    pose = contactPose(LOG.theta, pushAnim.side);
    SFX.scrapeSet(0.04 + 0.1 * 6 * s * (1 - s));
  }
  player.pos.set(pose.x, 0, pose.z); player.yaw = pose.yaw;
  pitch += (-0.3 - pitch) * Math.min(1, 4 * dt);                  // смотрим чуть вниз, на упор
  if (s >= 1) {
    pushAnim.active = false; logScene = 'cleared'; pitch = -0.04;
    SFX.scrapeStop(); SFX.thud();
  }
}

function startCrank() { logScene = 'cranking'; crankT = 0; SFX.crank(); }
function updateCrank(dt) {
  crankCool -= dt;
  if (logScene === 'broken' && mode === 'car' && input.moveY > 0.5 && crankCool <= 0) { SFX.crank(true); crankCool = 2.4; }
  if (logScene !== 'cranking') return;
  crankT += dt;
  const turning = (crankT % 1.5) < 1.0 && crankT < 3.7;           // стартёр крутит
  const pulse = turning ? 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(crankT * 55)) : 1;
  if (headOn) carParts.headlights.forEach(h => { h.intensity = 2.4 * pulse; });
  speedEl.style.opacity = fuelEl.style.opacity = turning ? (0.55 + 0.45 * Math.random()) : 1;
  if (crankT >= CONFIG.CRANK_TIME) {
    speedEl.style.opacity = fuelEl.style.opacity = '';
    logScene = 'broken'; breakCar();
    evt.state = 'BROKEN'; evt.t = 0;
  }
}

/* =====================================================================
   ПРОДОЛЖЕНИЕ СЦЕНЫ ПОЛОМКИ — всё на таймерах, без звука, текста-подсказок и диалогов
   evt.state (v0.9): NONE -> BROKEN -> CAR_PASS -> WAIT_60_2 -> HELP_WAIT -> BOARD ([E]) -> RIDE (60 с) -> FADE_OUT -> CLOCK(00:00) -> FADE_BLACK -> FADE_IN -> MOTEL -> END
   ===================================================================== */
const fadeEl = $('fade'), clockEl = $('clock');
const evt = { state: 'NONE', t: 0 };
const FADE_OUT = 1.8, CLOCK_HOLD = 2.5, FADE_IN = 1.8;          // с: затемнение, надпись, возврат картинки
const HELP_TRAVEL = 20.1;                                        // с: 300 м при 16 м/с + торможение 6 м/с² (цель — приехать ровно через 60 с после проезда)
const NPC = { active: false, solid: false, mode: '', x: 0, z: 0, h: 0, v: 0, tz: 0, stopZ: 0, passed: false };
const npcGroup = new THREE.Group();
const npcParts = { paint: null, wheels: [] };

// Одна фоновая машина на оба события; строится заранее и лежит под землёй (свет не пересобирается)
(function buildNpcCar() {
  const g = npcGroup;
  g.position.set(0, -1000, 0);
  scene.add(g);
  buildCarModel(g, npcParts, { paint: 0x1d3a5c, spots: 1, plate: 'KGZ 771', driver: true });
  npcParts.wheels = npcParts.wheelsAll;
})();

const npcFocus = () => (mode === 'car' ? car.pos : player.pos);

// Полоса (поперечная координата x), на которой фоновая машина никого не заденет:
// сломанная машина, игрок и бревно учитываются, defaultX получает небольшой приоритет
function pickLaneX(defaultX) {
  let best = defaultX, bs = -1e9;
  for (const x of [-3.0, -2.4, -1.6, 0, 1.6, 2.4, 3.0]) {
    let s = Math.abs(x - car.pos.x) - 2.4 - 1.0;
    if (mode === 'foot') s = Math.min(s, Math.abs(x - player.pos.x) - 0.5 - 1.0);
    if (LOG.active) for (let i = 0; i <= 8; i++) s = Math.min(s, Math.abs(x - (LOG.ax + (LOG.bx - LOG.ax) * i / 8)) - LOG.r - 1.0);
    if (x === defaultX) s += 0.4;
    if (s > bs) { bs = s; best = x; }
  }
  return best;
}

function hideNpc() {
  NPC.active = false; NPC.solid = false;
  npcGroup.position.set(0, -1000, 0);
}

// Машина едет по своей полосе; игрока и сломанную машину обходит за счёт выбора полосы
function startCarPass() {
  const uz = roadDirZ();
  NPC.mode = 'pass'; NPC.passed = false; NPC.solid = false;
  NPC.x = pickLaneX(2.4 * uz);                                  // встречная полоса (слева по ходу игрока)
  NPC.z = npcFocus().z + uz * 72;                               // появляется в темноте за ~72 м и проезжает мимо примерно через 3 с
  NPC.tz = -uz;                                                 // едет навстречу
  NPC.h = Math.atan2(0, uz);
  NPC.v = 24;
  npcParts.paint.color.set(0x1d3a5c);
  NPC.active = true;
}

// Другая машина подъезжает сзади и останавливается рядом с игроком. Водитель не выходит, игрока не берёт.
function startHelp() {
  const f = npcFocus(), uz = roadDirZ();
  NPC.mode = 'help'; NPC.passed = false; NPC.solid = false;
  NPC.x = pickLaneX(-2.4 * uz);                                 // правая полоса по ходу игрока
  let sz = f.z + uz * 6;
  for (const dz of [0, 6, -6, 12, -12, 20, -20]) {              // стоп-точка рядом, но не вплотную к сломанной машине
    const z = f.z + uz * dz;
    const dc = Math.hypot(NPC.x - car.pos.x, z - car.pos.z), dp = Math.hypot(NPC.x - f.x, z - f.z);
    const dl = LOG.active ? distToLog(NPC.x, z) : 99;
    if (dc >= 5.5 && dp >= 3.0 && dl >= 2.8) { sz = z; break; }
  }
  NPC.stopZ = sz;
  NPC.z = sz - uz * 300;                                        // 300 м позади точки остановки: в пути ~HELP_TRAVEL с
  NPC.tz = uz;
  NPC.h = Math.atan2(0, -uz);
  NPC.v = 16;
  npcParts.paint.color.set(0xcfd2d8);
  NPC.active = true;
}

function updateNpc(dt) {
  if (!NPC.active) return;
  if (NPC.mode === 'pass') {
    NPC.z += NPC.tz * NPC.v * dt;
    const f = npcFocus(), ahead = (f.z - NPC.z) * NPC.tz;       // > 0: игрок ещё впереди по ходу машины
    if (!NPC.passed && ahead <= 0) { NPC.passed = true; evt.state = 'WAIT_60_2'; evt.t = 0; }   // проехала мимо игрока
    if (NPC.passed && -ahead > 380) { hideNpc(); return; }
  } else if (NPC.mode === 'help') {
    const d = (NPC.stopZ - NPC.z) * NPC.tz;                     // сколько осталось до точки остановки
    if (d <= 0.05) { NPC.z = NPC.stopZ; NPC.v = 0; NPC.solid = true; }
    else {
      NPC.v = Math.min(16, Math.max(0.35, Math.sqrt(2 * 6 * d)));   // равномерное торможение до полной остановки
      NPC.z += NPC.tz * NPC.v * dt;
      if ((NPC.stopZ - NPC.z) * NPC.tz < 0) NPC.z = NPC.stopZ;
    }
  }
  if (NPC.mode === 'carry' || NPC.mode === 'leave') {            // едет по дороге вперёд (с игроком / одна)
    NPC.v = Math.min(18, NPC.v + 4 * dt); NPC.z += NPC.tz * NPC.v * dt;
    if (NPC.mode === 'leave' && Math.abs(NPC.z - NPC.z0) > 450) { hideNpc(); return; }
  }
  npcGroup.position.set(NPC.x, 0, NPC.z);
  npcGroup.rotation.y = NPC.h;
  npcParts.wheels.forEach(w => { w.rotation.x -= NPC.v * dt / 0.38; });
}

// Стоящая машина — препятствие для игрока и машины
function pushOutNpc(p, rad) {
  if (!NPC.solid) return false;
  let hit = false;
  const sh = Math.sin(NPC.h), ch = Math.cos(NPC.h);
  for (const off of [-1.5, 0, 1.5]) {
    const cx = NPC.x - sh * off, cz = NPC.z - ch * off, dx = p.x - cx, dz = p.z - cz, m = rad + 1.1, d2 = dx * dx + dz * dz;
    if (d2 < m * m) { const d = Math.sqrt(d2) || 0.001, k = (m - d) / d; p.x += dx * k; p.z += dz * k; hit = true; }
  }
  return hit;
}

function updateEvents(dt) {
  switch (evt.state) {
    case 'BROKEN':                                              // 1: поломка, управление у игрока. 2: первая машина проезжает мимо через ~3 с
      startCarPass(); evt.state = 'CAR_PASS'; evt.t = 0; evt.spawned = false; break;
    case 'CAR_PASS':                                            // переход в WAIT_60_2 делает updateNpc, когда машина проехала игрока
      break;
    case 'WAIT_60_2':                                           // 3: через 60 с после проезда первой приезжает вторая и ждёт
      evt.t += dt;
      if (!evt.spawned && evt.t >= 60 - HELP_TRAVEL) { evt.spawned = true; startHelp(); }
      if (evt.spawned && NPC.solid) { evt.state = 'HELP_WAIT'; evt.t = 0; }
      break;
    case 'HELP_WAIT':                                           // 4: ждёт. Садится игрок САМ: [E] / «Сесть» рядом с машиной (см. toggleCar)
    case 'BOARD':
      break;
    case 'RIDE':                                                // 5: поездка ровно RIDE_TIME с, первое лицо изнутри
      evt.t += dt;
      if (evt.t >= CONFIG.RIDE_TIME) { evt.state = 'FADE_OUT'; evt.t = 0; }
      break;
    case 'FADE_OUT':                                            // 6: только теперь затемнение и «00:00»
      evt.t += dt; fadeEl.style.opacity = smooth(Math.min(1, evt.t / 1));
      if (evt.t >= 1) { evt.state = 'CLOCK'; evt.t = 0; clockEl.style.opacity = 1; }
      break;
    case 'CLOCK':                                               // чёрный экран, белое «00:00», 1.5 с
      evt.t += dt;
      if (evt.t >= 1.5) { evt.state = 'FADE_BLACK'; evt.t = 0; }
      break;
    case 'FADE_BLACK':                                          // надпись гаснет, экран остаётся чёрным; под ним — переход в мотель
      evt.t += dt; clockEl.style.opacity = 1 - smooth(Math.min(1, evt.t / 0.5));
      if (evt.t >= 0.7) { teleportToMotel(); evt.state = 'FADE_IN'; evt.t = 0; }
      break;
    case 'FADE_IN':
      evt.t += dt; fadeEl.style.opacity = 1 - smooth(Math.min(1, evt.t / 1.2));
      if (evt.t >= 1.2) { evt.state = 'MOTEL'; evt.t = 0; inputEnabled = true; }
      break;
    case 'END':                                                 // вошли в номер: затемнение, сцена завершена
      evt.t += dt; fadeEl.style.opacity = smooth(Math.min(1, evt.t / 1.2));
      break;
    default: break;
  }
}

/* =====================================================================
   РАДИО: car_radio1.mp3 -> car_radio2.mp3 -> car_radio3.mp3 -> по кругу (файлы лежат рядом с игрой)
   Выключено по умолчанию = тишина. Нет файла — просто тишина, без ошибок. Играет только пока игрок в машине.
   ===================================================================== */
const Radio = (() => {
  const FILES = ['car_radio1.mp3', 'car_radio2.mp3', 'car_radio3.mp3'];
  const btn = $('radio');
  let on = false, idx = 0, el = null, fails = 0, want = false;

  function render() { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function kill() {
    if (!el) return;
    const a = el; el = null; want = false;
    a.onended = a.onerror = null;
    try { a.pause(); a.removeAttribute('src'); a.load(); } catch (e) {}
  }
  function failed() {                                  // файл не найден / не играет: пробуем следующий, но не бесконечно
    if (!on) return;
    kill(); fails++;
    if (fails >= FILES.length) return;                 // ни один не играет — тишина
    idx = (idx + 1) % FILES.length; start();
  }
  function start() {
    kill();
    if (!on) return;
    let a;
    try { a = new Audio(); } catch (e) { return; }
    el = a; a.preload = 'auto'; a.volume = 0.85;
    a.onended = () => { if (el !== a) return; kill(); idx = (idx + 1) % FILES.length; start(); };   // сразу следующая песня
    a.onerror = () => { if (el === a) failed(); };
    a.addEventListener('playing', () => { if (el === a) fails = 0; });
    try { a.src = FILES[idx]; } catch (e) { failed(); return; }
    want = false;
    sync();
  }
  // играет, только если радио включено, игрок в машине и игра не на паузе
  function sync() {
    if (!el) return;
    const should = on && mode === 'car' && running;
    if (should && !want) {
      want = true; const a = el;
      try { const p = a.play(); if (p && p.catch) p.catch(() => { if (el === a) { want = false; if (!a.error) return; failed(); } }); } catch (e) { failed(); }
    } else if (!should && want) { want = false; try { el.pause(); } catch (e) {} }
  }
  function toggle() {
    on = !on; fails = 0;
    if (on) { idx = 0; start(); } else kill();       // выключили — музыка стихает сразу; включили — с car_radio1.mp3
    render();
  }
  render();
  return { toggle, update: sync, get on() { return on; }, get index() { return idx; }, get element() { return el; } };
})();
$('radio').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); if (running) Radio.toggle(); }, { passive: false });
$('radio').addEventListener('touchend', e => e.preventDefault(), { passive: false });
$('radio').addEventListener('click', () => { if (running) Radio.toggle(); });

/* =====================================================================
   v0.8: ДИАЛОГИ, ПРЕДМЕТЫ, ПОЕЗДКА С ВОДИТЕЛЕМ, МОТЕЛЬ
   ===================================================================== */
// --- предметы игрока (без интерфейса) и баланс
player.items = [];
Object.defineProperty(player, 'balance', { get: () => eco.money, set: v => { eco.money = v; } });
const giveItem = id => { if (!player.items.includes(id)) player.items.push(id); };
const hasItem = id => player.items.includes(id);

// --- диалоги: плашка внизу экрана, реплики сменяются сами по времени, пропуск — E / пробел / Enter / клик / касание
const Dialog = (() => {
  const box = $('dialog'), nameEl = $('dlgName'), textEl = $('dlgText');
  let q = [], i = 0, t = 0, dur = 3, done = null, active = false;
  function show() {
    const l = q[i];
    nameEl.textContent = l.who; nameEl.className = l.me ? 'me' : '';
    textEl.textContent = l.text; box.style.display = 'block';
    t = 0; dur = 1.7 + l.text.length * 0.05;
  }
  function finish() {
    active = false; box.style.display = 'none'; inputEnabled = true;
    const cb = done; done = null; if (cb) cb();
  }
  function next() { if (!active) return; i++; if (i >= q.length) finish(); else show(); }
  return {
    play(lines, cb) { if (active || !lines.length) return false; q = lines; i = 0; done = cb || null; active = true; inputEnabled = false; show(); return true; },
    skip() { if (active && t > 0.4) next(); },
    update(dt) { if (!active) return; t += dt; if (t >= dur) next(); },
    get active() { return active; },
  };
})();
document.addEventListener('click', () => { if (Dialog.active) Dialog.skip(); });

// --- камера пассажира: плавный переход из глаз игрока на правое переднее сиденье машины NPC
const ride = { active: false, t: 0, fx: 0, fy: 0, fz: 0, fyaw: 0, fpitch: 0 };
const RIDE_BLEND = 1.3, PASSENGER = { x: 0.45, y: 1.38, z: -0.05 };
function rideCamera(dt) {
  ride.t += dt;
  const k = smooth(Math.min(1, ride.t / RIDE_BLEND)), s = Math.sin(NPC.h), c = Math.cos(NPC.h);
  const sx = NPC.x + PASSENGER.x * c + PASSENGER.z * s, sz = NPC.z - PASSENGER.x * s + PASSENGER.z * c;
  camera.position.set(ride.fx + (sx - ride.fx) * k, ride.fy + (PASSENGER.y - ride.fy) * k, ride.fz + (sz - ride.fz) * k);
  camera.rotation.set(ride.fpitch + (-0.05 - ride.fpitch) * k, ride.fyaw + wrapAngle(NPC.h - ride.fyaw) * k, 0);
  sky.position.copy(camera.position);
}
// Посадка: игрок САМ подходит к машине и жмёт [E] / «Сесть». Автопосадки нет.
const BOARD_DIST = 3.4;
const canBoard = () => evt.state === 'HELP_WAIT' && NPC.solid && mode === 'foot' && Math.hypot(player.pos.x - NPC.x, player.pos.z - NPC.z) < BOARD_DIST;
function boardNpc() {
  inputEnabled = false;
  ride.active = true; ride.t = 0;
  ride.fx = camera.position.x; ride.fy = camera.position.y; ride.fz = camera.position.z;
  ride.fyaw = camera.rotation.y; ride.fpitch = camera.rotation.x;
  player.vel.set(0, 0, 0); applyLights();
  npcParts.cabin.forEach(m => { m.visible = false; });       // изнутри стёкла не мешают обзору
  evt.state = 'BOARD'; evt.t = 0;
  const go = () => { NPC.mode = 'carry'; NPC.solid = false; NPC.tz = roadDirZ(); inputEnabled = false; evt.state = 'RIDE'; evt.t = 0; };   // поездка (ровно RIDE_TIME с) начинается, когда машина трогается
  if (CONFIG.CAR_DIALOG) Dialog.play([{ who: 'Водитель', text: 'Машина сломалась? Садись, подброшу до мотеля' }, { who: 'Игрок', me: 1, text: 'Было бы отлично, спасибо' },
    { who: 'Водитель', text: 'Поехали' }], go);
  else go();
}

/* ---------- мотель ----------
   Локальная система: x — вдоль дороги, z — от стены здания к дороге (фасад на z = 0); мировые: x = MX - z, z = MZ + x.
   ВСЕ стены и мебель создаются через W()/furn(): мешу и коллайдеру — одни и те же границы, поэтому невидимых стен нет. */
const MOTEL = { built: false, x: 17, z: 0, group: null, boxes: [], doors: [], marker: null, markerOn: false,
  admin: null, paid: false, near: false };
const motelW = (lx, lz) => ({ x: MOTEL.x - lz, z: MOTEL.z + lx });
const motelL = (wx, wz) => ({ x: wz - MOTEL.z, z: MOTEL.x - wx });
const RECEPTION = { x: -8, z: -3.6, r: 1.2 };
const MOTEL_PRICE = { room: 10, repair: 29 };
const ROOM_DOORS = [[6, -0.25], [7, 3.25], [8, 6.75], [9, 10.25]];       // [номер, центр двери по x]; дверь в стене коридора z = -2.3

function buildMotel(mz) {
  if (MOTEL.built) return;
  MOTEL.built = true; MOTEL.z = mz;
  const g = new THREE.Group(); g.position.set(MOTEL.x, 0, mz); g.rotation.y = -Math.PI / 2; scene.add(g); MOTEL.group = g;
  const H = 3.0;
  // --- текстуры (рисуются в canvas, внешних файлов нет)

// столкновения с мотелем (закрытые двери — тоже стены; открытая дверь проход не закрывает)
function pushOutMotel(p, rad) {
  if (!MOTEL.built) return false;
  const q = motelL(p.x, p.z), lx = q.x, lz = q.z;
  if (lx < -16 || lx > 14 || lz < -10 || lz > 2) return false;
  let hit = false, px = lx, pz = lz;
  for (const b of MOTEL.boxes) {
    if (b.door && b.door.open > 0.6) continue;
    const cx = Math.max(b.x0, Math.min(px, b.x1)), cz = Math.max(b.z0, Math.min(pz, b.z1)), dx = px - cx, dz = pz - cz, d2 = dx * dx + dz * dz;
    if (d2 >= rad * rad) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (rad - d) / d; px += dx * k; pz += dz * k; }
    else {                                                                                       // центр внутри коробки: выходим по ближайшей стороне
      const o = [px - b.x0, b.x1 - px, pz - b.z0, b.z1 - pz], m = Math.min(...o);
      if (m === o[0]) px = b.x0 - rad; else if (m === o[1]) px = b.x1 + rad; else if (m === o[2]) pz = b.z0 - rad; else pz = b.z1 + rad;
    }
    hit = true;
  }
  if (hit) { p.z = MOTEL.z + px; p.x = MOTEL.x - pz; }
  return hit;
}

// [E] у двери номера: открыть/закрыть. Дверь 9 заперта без ключа.
function motelDoorAction() {
  if (!MOTEL.built || evt.state !== 'MOTEL') return false;
  const q = motelL(player.pos.x, player.pos.z);
  let best = null, bd = 1.7;
  for (const d of MOTEL.doors) { const dd = Math.hypot(q.x - d.xc, q.z + 2.3); if (dd < bd) { bd = dd; best = d; } }
  if (!best || (best.locked && !hasItem('roomKey_9'))) return false;
  if (best.target === 1 && Math.hypot(q.x - best.xc, q.z + 2.3) < 0.95) return true;             // стоим в проёме — не закрываем
  best.target = best.target ? 0 : 1;
  return true;
}

function updateMotel(dt) {

  for (const d of MOTEL.doors) {                                                                 // створки плавно открываются и закрываются
    if (d.open !== d.target) { d.open += Math.sign(d.target - d.open) * Math.min(Math.abs(d.target - d.open), dt * 1.6); }
    d.piv.rotation.y = 1.6 * smooth(d.open);
  }
  if (evt.state !== 'MOTEL' || Dialog.active || !inputEnabled) return;
  const q = motelL(player.pos.x, player.pos.z), lx = q.x, lz = q.z;
  // стойка администратора
  const dr = Math.hypot(lx - RECEPTION.x, lz - RECEPTION.z);
  if (dr > RECEPTION.r + 1.5) MOTEL.near = false;
  if (!MOTEL.paid && dr < RECEPTION.r && !MOTEL.near) {
    MOTEL.near = true;
    const A = 'Администратор', P = 'Игрок', total = MOTEL_PRICE.room + MOTEL_PRICE.repair;
    const lines = [{ who: A, text: 'Доброй ночи. Номер нужен?' }, { who: P, me: 1, text: 'Да, на одну ночь. И машину бы починить' },
      { who: A, text: 'Номер на ночь - ' + MOTEL_PRICE.room + '$. Ремонт - еще ' + MOTEL_PRICE.repair + '$. Итого ' + total + '$' }];
    if (player.balance >= total) {
      lines.push({ who: P, me: 1, text: 'Держите' });
      Dialog.play(lines, () => {
        player.balance -= total; MOTEL.paid = true; SFX.cash(); giveItem('roomKey_9');
        Dialog.play([{ who: A, text: 'Ваш номер 9, вот ключи. Машину утром заберете отремонтированной' }], () => { MOTEL.markerOn = true; d9.locked = false; });
      });
    } else {
      lines.push({ who: A, text: 'Не хватает денег' });
      Dialog.play(lines);
    }
  }
  // дверь номера 9: с ключом открывается при подходе, зайдя внутрь — сцена заканчивается
  if (hasItem('roomKey_9')) {
    if (Math.hypot(lx - d9.xc, lz + 2.3) < 1.5 && d9.target === 0 && d9.open === 0) d9.target = 1;
    if (d9.open > 0.7 && lx > d9.xc - 1.5 && lx < d9.xc + 1.5 && lz < -3.5) { evt.state = 'END'; evt.t = 0; inputEnabled = false; }
  }
}

/* ---------- HUD: только приборы и баланс, без подсказок ---------- */
const hudLast = { act: '', speed: -1, bar: '', fuel: -1, low: null, money: '' };    // DOM трогаем только при изменении значения (иначе лишний layout каждый кадр)
function updateHUD() {
  if (mode === 'car') {
    const sp = Math.round(Math.abs(car.speed) * 3.6);
    if (sp !== hudLast.speed) { hudLast.speed = sp; speedEl.innerHTML = sp + '<small>км/ч</small>'; }
    const f = clamp(car.fuel / CONFIG.FUEL_TANK, 0, 1), bar = (f * 100).toFixed(0) + '%', fl = Math.ceil(car.fuel), low = f < CONFIG.FUEL_LOW;
    if (bar !== hudLast.bar) { hudLast.bar = bar; fuelBar.style.width = bar; }
    if (fl !== hudLast.fuel) { hudLast.fuel = fl; fuelTxt.textContent = fl; }
    if (low !== hudLast.low) { hudLast.low = low; fuelEl.classList.toggle('low', low); }
  }
  const act = canBoard() ? 'Сесть' : 'Действие';                              // кнопка действия на тач-экране
  if (act !== hudLast.act) { hudLast.act = act; $('bAct').textContent = act; }
  const m = '$' + eco.money;
  if (m !== hudLast.money) { hudLast.money = m; moneyEl.textContent = m; }
}

/* =====================================================================
   ЦИКЛ
   ===================================================================== */
let lastT = performance.now();
// Динамическое разрешение: если кадры стабильно долгие — снижаем разрешение рендера, если запас большой — возвращаем
const PR_MAX = Math.min(window.devicePixelRatio || 1, TOUCH_UI ? 1.25 : 1.5);
let prNow = PR_MAX, ftAvg = 16.7, prCool = 3;
function adaptRes(frameMs, dt) {
  ftAvg += (Math.min(frameMs, 100) - ftAvg) * 0.05; prCool -= dt;
  if (prCool > 0) return;
  let next = prNow;
  if (ftAvg > 24 && prNow > 0.6) next = Math.max(0.6, prNow - 0.2);
  else if (ftAvg < 14 && prNow < PR_MAX) next = Math.min(PR_MAX, prNow + 0.1);
  if (next !== prNow) { prNow = next; renderer.setPixelRatio(prNow); renderer.setSize(window.innerWidth, window.innerHeight); prCool = 4; }
}
function frame(now) {
  requestAnimationFrame(frame);
  const frameMs = now - lastT;
  const dt = Math.min(0.05, frameMs / 1000);
  lastT = now;
  if (running) adaptRes(frameMs, dt);
  if (running) {
    readInput();
    flushLook();
    if (mode === 'car') updateCar(dt); else updateFoot(dt);
    updateFilling(dt); updateFuelPhase(dt);
    updatePush(dt); updateCrank(dt);
    updateEvents(dt); updateNpc(dt); updateFigures(dt); Radio.update(); Dialog.update(dt); updateMotel(dt);
    updateBreakdown(dt);
    updateShopBell();
    if (cashier && ST.placed) cashier.lookAt(camera.position.x, 0, camera.position.z);
    SFX.engine(mode === 'car' && !car.broken && logScene !== 'cranking', Math.abs(car.speed), sputterT > 0);
    // камера в машине медленно возвращается прямо, если не трогаем обзор
    if (mode === 'car' && now - lastLookTime > 1500 && Math.abs(car.speed) > 3) {
      const k = Math.min(1, 1.5 * dt);
      car.lookYaw -= car.lookYaw * k; pitch += (-0.04 - pitch) * k;
    }
    updateCamera(dt);
    updateWorld(camera.position.x, camera.position.z);
    updateHUD();
  }
  renderer.render(scene, camera);
}

/* =====================================================================
   МЕНЮ / СТАРТ / ПАУЗА
   ===================================================================== */
function startGame() {
  SFX.init();
  running = true;
  Radio.update();
  $('menu').style.display = 'none';
  lastT = performance.now();
  lockPointer();
}
function pauseGame() {
  running = false; lookAccX = lookAccY = 0;
  SFX.pause();
  Radio.update();
  for (const k in keys) keys[k] = false;
  joy.id = null; joy.x = joy.y = 0; lookTouch.id = null;
  $('joyBase').style.display = $('joyKnob').style.display = 'none';
  $('play').textContent = 'ПРОДОЛЖИТЬ';
  $('menu').style.display = 'flex';
}
$('play').addEventListener('click', startGame);
document.addEventListener('visibilitychange', () => { if (document.hidden && running) pauseGame(); });

// стартовая позиция камеры, чтобы за меню уже была картинка
updateCamera(0);
requestAnimationFrame(frame);

// для отладки / будущих эпизодов
window.GAME = { CONFIG, scene, camera, car, player, breakCar, startRunout, placeStation, eco, ST, FUEL_ZONE, stationGroup, LOG, pushAnim, evt, NPC, treeChunks, SPECIES, figures, POOL, Radio, Dialog, MOTEL, ride, pushOutMotel, player, giveItem, hasItem, teleportToMotel,
  get inputEnabled() { return inputEnabled; }, get logScene() { return logScene; }, get mode() { return mode; } };
})();
</script>
